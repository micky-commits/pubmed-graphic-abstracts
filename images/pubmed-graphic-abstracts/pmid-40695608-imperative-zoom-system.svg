<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="118" fill="#153f4a"/><text x="64" y="58" font-size="38" fill="#fff" font-weight="800">Imperative Trial</text><text x="64" y="98" font-size="24" fill="#ccebed" font-weight="600">0.088インチ吸引カテーテルを含むZoom再灌流システム</text><text x="1390" y="72" font-size="24" fill="#fff" font-weight="700">PMID: 40695608</text><rect x="64" y="168" width="450" height="410" rx="14" fill="#e6f4f1" stroke="#64aaa5" stroke-width="4"/><rect x="575" y="168" width="450" height="410" rx="14" fill="#fff7ea" stroke="#e3a548" stroke-width="4"/><rect x="1086" y="168" width="450" height="410" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="96" y="218" font-size="30" fill="#12615b" font-weight="800">対象</text><text x="96" y="282" font-size="26" fill="#20303a" font-weight="700">前方循環LVO</text><text x="96" y="318" font-size="26" fill="#20303a">発症8時間以内</text><text x="96" y="354" font-size="26" fill="#20303a">260例</text><text x="607" y="218" font-size="30" fill="#8b5a04" font-weight="800">介入・評価</text><text x="607" y="282" font-size="26" fill="#20303a" font-weight="700">Zoomシステム単独</text><text x="607" y="318" font-size="26" fill="#20303a">3パス以内再灌流</text><text x="607" y="354" font-size="26" fill="#20303a">安全性も評価</text><text x="1118" y="218" font-size="30" fill="#9a312c" font-weight="800">主要結果</text><text x="1118" y="282" font-size="26" fill="#20303a" font-weight="700">3パス以内mTICI 2b-3: 83%</text><text x="1118" y="318" font-size="26" fill="#20303a">最終再灌流: 92%</text><text x="1118" y="354" font-size="26" fill="#20303a">穿刺-再灌流中央値19分</text><rect x="64" y="638" width="1472" height="150" rx="18" fill="#fff" stroke="#d6e2e2" stroke-width="3"/><text x="96" y="692" font-size="30" fill="#153f4a" font-weight="800">臨床的Take-home</text><text x="96" y="742" font-size="30" fill="#20303a" font-weight="700">大径アクセスを含む一体型システムで、迅速な再灌流が期待される。</text><text x="64" y="842" font-size="20" fill="#63747a">Japanese graphical abstract / PubMed新着文献アラートDB</text></svg>