<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">REPERFUSE-NA1 MRI: EVT後の遅発性二次虚血障害</text><text x="60" y="98" class="sub" fill="#c9eceb">Day1と90日MRIで、脳容積減少を神経保護試験の指標へ</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 41955072</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象</text><text x="84" y="242" class="t">ESCAPE-NA1 MRIサブ研究</text><text x="84" y="276" class="t">EVT後 43例</text><text x="84" y="310" class="t">Day1 MRI: &lt;5時間</text><text x="84" y="344" class="t">90日MRIで追跡</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">測定の発想</text><circle cx="650" cy="294" r="70" fill="#eaf3f9" stroke="#74a8c9" stroke-width="4"/><circle cx="650" cy="294" r="35" fill="#fdebea" stroke="#c7514a" stroke-width="4"/><path d="M760 294 L860 294" stroke="#49636b" stroke-width="5" marker-end="url(#arrow)"/><circle cx="970" cy="294" r="60" fill="#eaf3f9" stroke="#74a8c9" stroke-width="4"/><circle cx="970" cy="294" r="48" fill="#fff" stroke="#c7514a" stroke-width="4"/><text x="590" y="380" class="s muted">急性病変</text><text x="910" y="380" class="s muted">90日萎縮・脳室拡大</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">評価部位</text><text x="1180" y="242" class="t">全脳容積</text><text x="1180" y="276" class="t">脳室拡大</text><text x="1180" y="310" class="t">皮質灰白質・白質</text><text x="1180" y="344" class="t">視床・海馬</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="544" y="432" class="s muted">急性期梗塞を超えた「遅れて進む障害量」をMRIで定量</text><rect x="80" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="108" y="528" class="h blue">全脳容積</text><text x="108" y="576" class="num blue">減少</text><text x="108" y="606" class="xs muted">P&lt;0.001</text><rect x="446" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="474" y="528" class="h amber">脳室</text><text x="474" y="576" class="num amber">拡大</text><text x="474" y="606" class="xs muted">P&lt;0.001</text><rect x="812" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="840" y="528" class="h teal">患側構造</text><text x="840" y="576" class="num teal">萎縮</text><text x="840" y="606" class="xs muted">白質・視床・海馬など</text><rect x="1178" y="484" width="342" height="142" rx="18" class="card"/><text x="1206" y="528" class="h deep">機能自立</text><text x="1206" y="576" class="num deep">予測</text><text x="1206" y="606" class="xs muted">DWI体積 + 患側萎縮</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">再開通成功後も、90日までに二次的な脳萎縮が進む。</text><text x="96" y="786" class="t">神経保護薬の効果判定には、機能転帰だけでなくMRI量的指標が有用。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">試験設計への示唆</text><text x="862" y="754" class="t">将来試験では、脳室容積変化なら各群41例で50%低減を検出可能と推定。</text><text x="862" y="786" class="t">小規模サブ研究のため検証が必要。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: 急性期DWIだけでなく、90日脳容積変化が神経保護の評価軸になり得る。</text></svg>