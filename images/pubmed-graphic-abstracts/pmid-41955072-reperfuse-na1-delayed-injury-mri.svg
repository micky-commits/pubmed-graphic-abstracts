<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="118" fill="#153f4a"/><text x="64" y="58" font-size="38" fill="#fff" font-weight="800">REPERFUSE-NA1 MRI</text><text x="64" y="98" font-size="24" fill="#ccebed">EVT後の遅発性二次虚血障害を脳容積で測る</text><text x="1390" y="72" font-size="24" fill="#fff">PMID: 41955072</text><rect x="64" y="168" width="450" height="410" rx="14" fill="#e6f4f1" stroke="#64aaa5" stroke-width="4"/><rect x="575" y="168" width="450" height="410" rx="14" fill="#fff7ea" stroke="#e3a548" stroke-width="4"/><rect x="1086" y="168" width="450" height="410" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="96" y="218" font-size="30" fill="#12615b" font-weight="800">対象</text><text x="96" y="282" font-size="26" fill="#20303a" font-weight="700">ESCAPE-NA1 MRIサブ研究</text><text x="96" y="318" font-size="26" fill="#20303a">EVT後43例</text><text x="96" y="354" font-size="26" fill="#20303a">Day1と90日MRI</text><text x="607" y="218" font-size="30" fill="#8b5a04" font-weight="800">評価</text><text x="607" y="282" font-size="26" fill="#20303a" font-weight="700">全脳・局所容積変化</text><text x="607" y="318" font-size="26" fill="#20303a">脳室拡大</text><text x="607" y="354" font-size="26" fill="#20303a">萎縮指標</text><text x="1118" y="218" font-size="30" fill="#9a312c" font-weight="800">主要結果</text><text x="1118" y="282" font-size="26" fill="#20303a" font-weight="700">90日で有意な脳容積減少</text><text x="1118" y="318" font-size="26" fill="#20303a">DWI体積と萎縮が</text><text x="1118" y="354" font-size="26" fill="#20303a">機能自立を予測</text><rect x="64" y="638" width="1472" height="150" rx="18" fill="#fff" stroke="#d6e2e2" stroke-width="3"/><text x="96" y="692" font-size="30" fill="#153f4a" font-weight="800">臨床的Take-home</text><text x="96" y="742" font-size="30" fill="#20303a" font-weight="700">神経保護薬試験の評価指標として、90日MRI容積変化が使える可能性。</text></svg>