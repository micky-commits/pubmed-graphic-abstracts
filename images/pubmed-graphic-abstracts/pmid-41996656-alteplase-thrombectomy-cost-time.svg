<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">IV alteplase + MT の費用対効果は時間依存</text><text x="60" y="98" class="sub" fill="#c9eceb">直接搬入LVO: 16か国モデルで onset-to-IVT time を層別化</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 41996656</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象</text><text x="84" y="242" class="t">MT可能施設へ直接搬入</text><text x="84" y="276" class="t">前方循環LVO</text><text x="84" y="310" class="t">IVT・MTの両方に適応</text><text x="84" y="344" class="t">6試験 IPD / 2268例</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">モデル</text><text x="518" y="242" class="t">decision tree + Markov model</text><text x="518" y="276" class="t">15年 horizon</text><text x="518" y="310" class="t">16か国の費用・GDP閾値</text><text x="518" y="344" class="t">QALY / INMB / 感度分析</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">比較</text><text x="1180" y="242" class="t">IV alteplase + MT</text><text x="1180" y="276" class="t">vs</text><text x="1180" y="310" class="t">MT単独</text><text x="1180" y="344" class="t">発症→IVT時間で層別</text><line x1="200" y1="442" x2="1400" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="548" y="432" class="s muted">onset-to-IVT time が伸びるほど純便益が低下</text><rect x="80" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="108" y="528" class="h teal">&lt;140分</text><text x="108" y="576" class="num teal">有利</text><text x="108" y="606" class="xs muted">16か国で費用対効果良好</text><rect x="446" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="474" y="528" class="h blue">140-169分</text><text x="474" y="576" class="num blue">有利</text><text x="474" y="606" class="xs muted">概ね費用対効果あり</text><rect x="812" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="840" y="528" class="h amber">170-199分</text><text x="840" y="576" class="num amber">国差</text><text x="840" y="606" class="xs muted">8か国で不利に転じる</text><rect x="1178" y="484" width="342" height="142" rx="18" class="coralCard"/><text x="1206" y="528" class="h coral">≥200分</text><text x="1206" y="576" class="num coral">不利</text><text x="1206" y="606" class="xs muted">全体にINMB negative</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">bridging IVTを「する/しない」ではなく、時間軸を含めて考える。</text><text x="96" y="786" class="t">早く投与できるなら価値が高いが、遅れるほど健康便益・経済価値が下がる。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">費用対効果モデル研究。各国の医療費・WTP閾値に依存。</text><text x="862" y="786" class="t">直接搬入例が前提で、drip-and-ship一般化には注意。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: IVT併用の価値は「国」だけでなく、発症からIVTまでの分単位で変わる。</text></svg>