<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="126" fill="#143f4a"/><rect x="0" y="126" width="1600" height="8" fill="#ed826f"/><text x="58" y="58" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="39" fill="#fff" font-weight="850">高遺伝リスク高齢者ではaspirin利益を示唆</text><text x="58" y="101" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="23" fill="#cfecee" font-weight="650">ASPREE試験 事後解析 / 12,031例</text><rect x="1370" y="31" width="174" height="58" rx="7" fill="#ffffff" opacity="0.12"/><text x="1457" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="21" fill="#fff" font-weight="800">PMID 42100829</text><rect x="58" y="164" width="438" height="329" rx="8" fill="#e8f6f2" stroke="#68aaa3" stroke-width="3"/><circle cx="101" cy="210" r="22" fill="#13746b"/><text x="101" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">1</text><text x="139" y="219" font-size="30" fill="#105f59" font-weight="850">対象・研究設計</text><text x="91" y="283" font-size="27" fill="#1f3037" font-weight="700">70歳超 12,031例</text><text x="91" y="319" font-size="27" fill="#1f3037" font-weight="700">一次予防集団</text><text x="91" y="355" font-size="27" fill="#1f3037" font-weight="700">統合polygenic score</text><g transform="translate(344 386)" fill="none" stroke="#13746b" stroke-width="9" stroke-linecap="round"><circle cx="0" cy="-35" r="23" fill="#bfe3dc"/><path d="M-45 48c8-48 82-48 90 0"/><path d="M-82 44c4-30 37-39 55-22M82 44c-4-30-37-39-55-22" opacity=".55"/></g><rect x="581" y="164" width="438" height="329" rx="8" fill="#fff7e9" stroke="#e1a34e" stroke-width="3"/><circle cx="624" cy="210" r="22" fill="#a76a09"/><text x="624" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">2</text><text x="662" y="219" font-size="30" fill="#835304" font-weight="850">介入・比較</text><text x="614" y="283" font-size="27" fill="#1f3037" font-weight="700">iPGS五分位で層別</text><text x="614" y="319" font-size="27" fill="#1f3037" font-weight="700">aspirin vs placebo</text><text x="614" y="355" font-size="27" fill="#1f3037" font-weight="700">虚血性脳卒中・大出血</text><g transform="translate(800 404)" fill="none" stroke="#a76a09" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-86 0H75"/><path d="M47-29l36 29-36 29"/></g><rect x="1104" y="164" width="438" height="329" rx="8" fill="#fdeeed" stroke="#dc7f74" stroke-width="3"/><circle cx="1147" cy="210" r="22" fill="#a83d35"/><text x="1147" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">3</text><text x="1185" y="219" font-size="30" fill="#94362f" font-weight="850">主要結果</text><text x="1137" y="283" font-size="27" fill="#1f3037" font-weight="700">最高五分位で</text><text x="1137" y="319" font-size="27" fill="#1f3037" font-weight="700">虚血性脳卒中 HR 0.49</text><text x="1137" y="355" font-size="27" fill="#1f3037" font-weight="700">大出血の明確な増加なし</text><g transform="translate(1415 394)" fill="none" stroke="#a83d35" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-55 4l34 34 72-89"/></g><rect x="58" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="565" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="1072" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="58" y="530" width="9" height="137" fill="#13746b"/><rect x="565" y="530" width="9" height="137" fill="#e1a34e"/><rect x="1072" y="530" width="9" height="137" fill="#dc7f74"/><text x="91" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 1</text><text x="91" y="616" font-size="25" fill="#1f3037" font-weight="700">平均的高齢者への</text><text x="91" y="650" font-size="25" fill="#1f3037" font-weight="700">一律投与ではない</text><text x="598" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 2</text><text x="598" y="616" font-size="25" fill="#1f3037" font-weight="700">遺伝リスクで</text><text x="598" y="650" font-size="25" fill="#1f3037" font-weight="700">絶対利益を濃縮</text><text x="1105" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 3</text><text x="1105" y="616" font-size="25" fill="#1f3037" font-weight="700">事後解析のため</text><text x="1105" y="650" font-size="25" fill="#1f3037" font-weight="700">臨床実装は未確立</text><rect x="58" y="710" width="1484" height="112" rx="8" fill="#143f4a"/><rect x="58" y="710" width="218" height="112" rx="8" fill="#ed826f"/><text x="167" y="760" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">CLINICAL</text><text x="167" y="793" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">TAKE-HOME</text><text x="309" y="758" font-size="25" fill="#fff" font-weight="820">aspirin一次予防は年齢だけでなく遺伝的脳卒中リスクで利益が大きい群を選べる可能性があるが、</text><text x="309" y="790" font-size="25" fill="#fff" font-weight="820">現時点では研究的所見。</text><text x="58" y="866" font-size="18" fill="#63777d">Japanese graphical abstract / PubMed新着文献アラート / 2026-07-16 / PMID 42100829</text></svg>