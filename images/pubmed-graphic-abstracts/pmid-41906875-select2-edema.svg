<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="36" y="30" width="1528" height="128" rx="18" fill="#0b5f7a"/>
  <text x="72" y="82" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="36" font-weight="700" fill="#fff">SELECT2: 大梗塞EVT後の脳浮腫</text>
  <text x="72" y="125" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="23" fill="#d7f3ff">PMID: 41906875 | Stroke 2026 | large ischemic core, secondary analysis</text>
  <rect x="60" y="190" width="470" height="305" rx="16" fill="#fff" stroke="#86c5da" stroke-width="3"/>
  <text x="92" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0b5f7a">対象</text>
  <text x="92" y="298" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">SELECT2大梗塞コア</text>
  <text x="92" y="345" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">EVT vs 内科治療</text>
  <text x="92" y="392" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">解析342例</text>
  <text x="92" y="439" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">7日以内の正中偏位</text>
  <rect x="565" y="190" width="470" height="305" rx="16" fill="#fff7ed" stroke="#f1a768" stroke-width="3"/>
  <text x="597" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#9a3412">浮腫シグナル</text>
  <text x="597" y="315" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="50" font-weight="700" fill="#ea580c">MLS 6.39 mm</text>
  <text x="597" y="375" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="30" fill="#7c2d12">vs 4.18 mm</text>
  <text x="597" y="435" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#7c2d12">EVTで脳浮腫が増加</text>
  <rect x="1070" y="190" width="470" height="305" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="1102" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0e7490">臨床的意味</text>
  <text x="1102" y="306" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">早期神経悪化と関連</text>
  <text x="1102" y="358" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">90日転帰不良と関連</text>
  <text x="1102" y="410" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">EVTの利益とは別に管理が必要</text>
  <rect x="60" y="525" width="1480" height="176" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="575" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" font-weight="700" fill="#0f172a">Take-home</text>
  <text x="92" y="625" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">大梗塞コアでもEVTの臨床利益はあるが、脳浮腫リスクは増える。</text>
  <text x="92" y="667" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">術後は浮腫を早期認識し、二次損傷を防ぐ個別管理が重要。</text>
  <text x="60" y="875" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="20" fill="#64748b">Ng FC, et al. Stroke. 2026. PMID: 41906875</text>
</svg>
