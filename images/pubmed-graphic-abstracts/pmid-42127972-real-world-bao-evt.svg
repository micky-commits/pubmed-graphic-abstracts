<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="36" y="30" width="1528" height="128" rx="18" fill="#0b5f7a"/>
  <text x="72" y="82" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="36" font-weight="700" fill="#fff">BAO EVT: 試験適格外の現実世界</text>
  <text x="72" y="125" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="23" fill="#d7f3ff">PMID: 42127972 | European Stroke Journal 2026 | beyond ATTENTION and BAOCHE</text>
  <rect x="60" y="190" width="470" height="305" rx="16" fill="#fff" stroke="#86c5da" stroke-width="3"/>
  <text x="92" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0b5f7a">対象</text>
  <text x="92" y="300" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">全国前向きレジストリ</text>
  <text x="92" y="350" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">AIS 49,471例</text>
  <text x="92" y="400" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">BAO 1012例</text>
  <text x="92" y="450" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">発症24h以内</text>
  <rect x="565" y="190" width="470" height="305" rx="16" fill="#fff7ed" stroke="#f1a768" stroke-width="3"/>
  <text x="597" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#9a3412">試験適格性</text>
  <text x="597" y="315" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" fill="#7c2d12">ATTENTION適格 24%</text>
  <text x="597" y="375" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" fill="#7c2d12">BAOCHE適格 6%</text>
  <text x="597" y="435" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" fill="#7c2d12">非適格 72%</text>
  <rect x="1070" y="190" width="470" height="305" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="1102" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0e7490">EVT効果</text>
  <text x="1102" y="310" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#155e75">ATTENTION適格: cOR 1.73</text>
  <text x="1102" y="365" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#155e75">死亡低下 RR 0.52</text>
  <text x="1102" y="420" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#155e75">非適格でも死亡低下 RR 0.77</text>
  <rect x="60" y="525" width="1480" height="176" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="575" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" font-weight="700" fill="#0f172a">Take-home</text>
  <text x="92" y="625" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">BAO患者の多くはRCT基準外だが、EVTは現実世界でも死亡低下と関連。</text>
  <text x="92" y="667" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">ATTENTION/BAOCHE基準だけでは拾えない症例への適応拡大を示唆。</text>
  <text x="60" y="875" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="20" fill="#64748b">Lee JY, et al. Eur Stroke J. 2026. PMID: 42127972</text>
</svg>
