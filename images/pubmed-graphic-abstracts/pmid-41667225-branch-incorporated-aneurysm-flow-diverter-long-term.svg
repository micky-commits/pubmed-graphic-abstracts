<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect x="0" y="0" width="1600" height="124" fill="#143f4a"/><text x="60" y="57" font-size="38" fill="#ffffff" font-weight="850">分枝合併動脈瘤FDは長期で閉塞</text><text x="60" y="99" font-size="24" fill="#cfecee" font-weight="650">韓国5施設 / branch-incorporated aneurysm</text><text x="1376" y="73" font-size="23" fill="#ffffff" font-weight="750">PMID: 41667225</text><rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/><text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text><text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">未破裂分枝合併動脈瘤</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">65例</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">中央値38か月臨床追跡</text><circle cx="408" cy="390" r="45" fill="#65aaa4" opacity="0.24"/><path d="M379 398 c14 -38 44 -38 58 0" fill="none" stroke="#11635d" stroke-width="8" stroke-linecap="round"/><circle cx="408" cy="362" r="22" fill="#11635d" opacity="0.85"/><rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/><text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">方法・比較</text><text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">Flow diverter留置</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">時期別閉塞率</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">分枝開存と症状を評価</text><path d="M736 392 h126" stroke="#8a5905" stroke-width="12" stroke-linecap="round"/><path d="M844 358 l52 34 -52 34" fill="none" stroke="#8a5905" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text><text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">閉塞率 6-8か月 29%</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">48か月超 86.5%</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">分枝閉塞23%も永続症状なし</text><path d="M1414 388 l28 30 l58 -78" fill="none" stroke="#9a312c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><rect x="566" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><rect x="1072" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">短中期閉塞は</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">遅い</text><text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">長期では閉塞率が</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">既報並みに上昇</text><text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">分枝閉塞は多いが</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">症候性は限定的</text><rect x="60" y="722" width="1480" height="98" rx="18" fill="#143f4a"/><text x="92" y="765" font-size="25" fill="#ffffff" font-weight="850">分枝を巻き込む動脈瘤のFDでは、短期閉塞率だけで失敗と見なさず長期追跡で評価する。</text><text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 41667225</text></svg>