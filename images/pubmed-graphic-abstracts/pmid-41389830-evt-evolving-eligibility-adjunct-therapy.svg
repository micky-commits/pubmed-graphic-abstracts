<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="118" fill="#153f4a"/><text x="64" y="58" font-size="38" fill="#fff" font-weight="800">EVTの適応拡大と補助療法</text><text x="64" y="98" font-size="24" fill="#ccebed">large core時代の血栓回収とその先</text><text x="1390" y="72" font-size="24" fill="#fff">PMID: 41389830</text><rect x="64" y="168" width="450" height="410" rx="14" fill="#e6f4f1" stroke="#64aaa5" stroke-width="4"/><rect x="575" y="168" width="450" height="410" rx="14" fill="#fff7ea" stroke="#e3a548" stroke-width="4"/><rect x="1086" y="168" width="450" height="410" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="96" y="218" font-size="30" fill="#12615b" font-weight="800">背景</text><text x="96" y="282" font-size="26" fill="#20303a" font-weight="700">EVTは標準治療へ</text><text x="96" y="318" font-size="26" fill="#20303a">large coreなど適応拡大</text><text x="607" y="218" font-size="30" fill="#8b5a04" font-weight="800">補助療法</text><text x="607" y="282" font-size="26" fill="#20303a" font-weight="700">IA血栓溶解</text><text x="607" y="318" font-size="26" fill="#20303a">細胞保護薬</text><text x="607" y="354" font-size="26" fill="#20303a">微小循環標的</text><text x="1118" y="218" font-size="30" fill="#9a312c" font-weight="800">課題</text><text x="1118" y="282" font-size="26" fill="#20303a" font-weight="700">再開通だけでは不十分</text><text x="1118" y="318" font-size="26" fill="#20303a">病態に合う治療選択</text><rect x="64" y="638" width="1472" height="150" rx="18" fill="#fff" stroke="#d6e2e2" stroke-width="3"/><text x="96" y="692" font-size="30" fill="#153f4a" font-weight="800">臨床的Take-home</text><text x="96" y="742" font-size="30" fill="#20303a" font-weight="700">次の課題は、誰にどの補助療法を組み合わせるかという精密化。</text></svg>