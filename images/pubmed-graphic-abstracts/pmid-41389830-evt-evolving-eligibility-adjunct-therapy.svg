<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">EVTの適応拡大と補助療法: 再開通の先へ</text><text x="60" y="98" class="sub" fill="#c9eceb">large core時代、IA血栓溶解・細胞保護薬・微小循環戦略をどう組み合わせるか</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 41389830</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">現在地</text><text x="84" y="242" class="t">EVTは標準治療</text><text x="84" y="276" class="t">large coreにも適応拡大</text><text x="84" y="310" class="t">大血管再開通率は高い</text><text x="84" y="344" class="t">それでも転帰不良が残る</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">転帰不良の標的</text><circle cx="620" cy="290" r="58" class="blueCard"/><text x="572" y="296" class="s blue">微小循環</text><circle cx="760" cy="290" r="58" class="amberCard"/><text x="720" y="296" class="s amber">酸化ストレス</text><circle cx="900" cy="290" r="58" class="coralCard"/><text x="862" y="296" class="s coral">炎症</text><circle cx="1040" cy="290" r="58" class="violetCard"/><text x="996" y="296" class="s violet">興奮毒性</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">補助療法</text><text x="1180" y="242" class="t">intra-arterial thrombolysis</text><text x="1180" y="276" class="t">cytoprotective agents</text><text x="1180" y="310" class="t">患者病態に合わせる</text><text x="1180" y="344" class="t">翻訳成功条件を再設計</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="604" y="432" class="s muted">macrovascular reperfusion から tissue-level rescue へ</text><rect x="80" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="108" y="528" class="h teal">適応</text><text x="108" y="576" class="num teal">拡大</text><text x="108" y="606" class="xs muted">large coreなど</text><rect x="446" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="474" y="528" class="h blue">IA溶解</text><text x="474" y="576" class="num blue">検討</text><text x="474" y="606" class="xs muted">末梢/微小血栓への戦略</text><rect x="812" y="484" width="342" height="142" rx="18" class="violetCard"/><text x="840" y="528" class="h violet">細胞保護</text><text x="840" y="576" class="num violet">再評価</text><text x="840" y="606" class="xs muted">病態と投与タイミングを一致</text><rect x="1178" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="1206" y="528" class="h amber">試験設計</text><text x="1206" y="576" class="num amber">精密化</text><text x="1206" y="606" class="xs muted">患者選択と機序の整合</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">再開通できても障害が残る患者に、どの病態が残っているかを見る。</text><text x="96" y="786" class="t">補助療法は一律追加ではなく、機序に合う患者へ。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">研究への示唆</text><text x="862" y="754" class="t">過去の神経保護薬失敗から、タイミング・対象選択・エンドポイントを再設計。</text><text x="862" y="786" class="t">再灌流と補助療法の組み合わせが次の試験テーマ。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: EVTの次の課題は、再開通後も転帰不良となる患者に補助療法を精密に合わせること。</text></svg>