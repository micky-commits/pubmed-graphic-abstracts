<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="36" y="30" width="1528" height="128" rx="18" fill="#0b5f7a"/>
  <text x="72" y="82" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="36" font-weight="700" fill="#fff">LASTE: ASPECTS 0-2でもEVTは有効か</text>
  <text x="72" y="125" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="23" fill="#d7f3ff">PMID: 41979451 | Stroke 2026 | largest infarcts, ASPECTS 0-2</text>
  <rect x="60" y="190" width="470" height="305" rx="16" fill="#fff" stroke="#86c5da" stroke-width="3"/>
  <text x="92" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0b5f7a">対象</text>
  <text x="92" y="300" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">LASTE post hoc</text>
  <text x="92" y="350" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">ASPECTS 0-2, n=181</text>
  <text x="92" y="400" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">中央値core 156 mL</text>
  <text x="92" y="450" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">発症6.5h以内</text>
  <rect x="565" y="190" width="470" height="305" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="597" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0e7490">有効性</text>
  <text x="597" y="315" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="42" font-weight="700" fill="#0e7490">gOR 1.81</text>
  <text x="597" y="375" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="30" fill="#155e75">mRS 0-3: 31.4% vs 8.5%</text>
  <text x="597" y="435" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">梗塞増大 -70.3 mL</text>
  <rect x="1070" y="190" width="470" height="305" rx="16" fill="#fff7ed" stroke="#f1a768" stroke-width="3"/>
  <text x="1102" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#9a3412">安全性</text>
  <text x="1102" y="315" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="38" font-weight="700" fill="#ea580c">死亡 38.4% vs 59.6%</text>
  <text x="1102" y="375" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#7c2d12">sICH 12.9% vs 4.5%</text>
  <text x="1102" y="435" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#7c2d12">出血リスクは要注意</text>
  <rect x="60" y="525" width="1480" height="176" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="575" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" font-weight="700" fill="#0f172a">Take-home</text>
  <text x="92" y="625" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">ASPECTS 0-2の超大梗塞でも、早期・80歳未満ならEVTで転帰改善と死亡低下。</text>
  <text x="92" y="667" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">梗塞サイズだけでEVTを除外しない、という方向を支持。</text>
  <text x="60" y="875" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="20" fill="#64748b">Lapergue B, et al. Stroke. 2026. PMID: 41979451</text>
</svg>
