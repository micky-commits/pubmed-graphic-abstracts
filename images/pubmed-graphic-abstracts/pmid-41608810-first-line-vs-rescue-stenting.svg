<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">First-line vs Rescue Intracranial Stenting</text><text x="60" y="98" class="sub" fill="#c9eceb">RESISTANT registry: 難治性LVOで初回ステントとレスキューステントを比較</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 41608810</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象</text><text x="84" y="242" class="t">急性LVO + 頭蓋内ステント</text><text x="84" y="276" class="t">RESISTANT registry</text><text x="84" y="310" class="t">2016-2023 / 827例</text><text x="84" y="344" class="t">RS 723例 / FLS 104例</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">2つの戦略</text><rect x="540" y="234" width="236" height="104" rx="16" class="blueCard"/><text x="566" y="276" class="h blue">First-line</text><text x="566" y="314" class="s ink">血栓回収前にステント</text><rect x="834" y="234" width="236" height="104" rx="16" class="amberCard"/><text x="860" y="276" class="h amber">Rescue</text><text x="860" y="314" class="s ink">MT不成功後にステント</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">解析</text><text x="1180" y="242" class="t">propensity score IPTW</text><text x="1180" y="276" class="t">主要有効性: 90日mRS 0-2</text><text x="1180" y="310" class="t">主要安全性: sICH</text><text x="1180" y="344" class="t">前方/後方循環も解析</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="564" y="432" class="s muted">ステントを「先に置くか」「失敗後に置くか」の実臨床比較</text><rect x="80" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="108" y="528" class="h blue">機能自立</text><text x="108" y="576" class="num blue">差なし</text><text x="108" y="606" class="xs muted">IPTW後 OR 0.64, CIは1を跨ぐ</text><rect x="446" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="474" y="528" class="h teal">sICH</text><text x="474" y="576" class="num teal">差なし</text><text x="474" y="606" class="xs muted">OR 0.93</text><rect x="812" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="840" y="528" class="h amber">再灌流/死亡</text><text x="840" y="576" class="num amber">差なし</text><text x="840" y="606" class="xs muted">二次評価項目も有意差なし</text><rect x="1178" y="484" width="342" height="142" rx="18" class="card"/><text x="1206" y="528" class="h deep">循環別</text><text x="1206" y="576" class="num deep">同様</text><text x="1206" y="606" class="xs muted">前方・後方循環で一貫</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">アテローム性狭窄疑いではFLSの発想は合理的だが、現状は差を示せず。</text><text x="96" y="786" class="t">手技時間、血管損傷、抗血小板導入のバランスで判断。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">レジストリ解析でランダム化なし。FLS群は少数。</text><text x="862" y="786" class="t">最適戦略には前向きRCTが必要。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: 初回ステントとレスキューの優劣はまだ不明。病変機序と手技経過で選ぶ段階。</text></svg>