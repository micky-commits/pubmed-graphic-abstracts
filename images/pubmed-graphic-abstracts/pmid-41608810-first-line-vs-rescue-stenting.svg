<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="118" fill="#153f4a"/><text x="64" y="58" font-size="38" fill="#fff" font-weight="800">First-line vs Rescue Stenting</text><text x="64" y="98" font-size="24" fill="#ccebed">RESISTANT registryの傾向スコア解析</text><text x="1390" y="72" font-size="24" fill="#fff">PMID: 41608810</text><rect x="64" y="168" width="450" height="410" rx="14" fill="#e6f4f1" stroke="#64aaa5" stroke-width="4"/><rect x="575" y="168" width="450" height="410" rx="14" fill="#fff7ea" stroke="#e3a548" stroke-width="4"/><rect x="1086" y="168" width="450" height="410" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="96" y="218" font-size="30" fill="#12615b" font-weight="800">対象</text><text x="96" y="282" font-size="26" fill="#20303a" font-weight="700">難治性LVO</text><text x="96" y="318" font-size="26" fill="#20303a">頭蓋内ステント</text><text x="96" y="354" font-size="26" fill="#20303a">827例</text><text x="607" y="218" font-size="30" fill="#8b5a04" font-weight="800">比較</text><text x="607" y="282" font-size="26" fill="#20303a" font-weight="700">初回ステント</text><text x="607" y="318" font-size="26" fill="#20303a">vs レスキューステント</text><text x="1118" y="218" font-size="30" fill="#9a312c" font-weight="800">主要結果</text><text x="1118" y="282" font-size="26" fill="#20303a" font-weight="700">90日自立に有意差なし</text><text x="1118" y="318" font-size="26" fill="#20303a">sICHに有意差なし</text><text x="1118" y="354" font-size="26" fill="#20303a">前方・後方循環でも同様</text><rect x="64" y="638" width="1472" height="150" rx="18" fill="#fff" stroke="#d6e2e2" stroke-width="3"/><text x="96" y="692" font-size="30" fill="#153f4a" font-weight="800">臨床的Take-home</text><text x="96" y="742" font-size="30" fill="#20303a" font-weight="700">現時点では優劣不明。最適戦略は前向き試験での検証が必要。</text></svg>