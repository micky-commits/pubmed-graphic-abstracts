<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="36" y="30" width="1528" height="128" rx="18" fill="#0b5f7a"/>
  <text x="72" y="82" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="36" font-weight="700" fill="#ffffff">WEBデバイスの長期成績: 安全性と閉塞維持</text>
  <text x="72" y="125" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="23" fill="#d7f3ff">PMID: 40764017 | JNIS 2026 | systematic review and meta-analysis, 25 studies</text>

  <rect x="60" y="190" width="470" height="305" rx="16" fill="#ffffff" stroke="#86c5da" stroke-width="3"/>
  <text x="92" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0b5f7a">対象</text>
  <text x="92" y="293" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・WEB治療後の脳動脈瘤</text>
  <text x="92" y="335" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・追跡1年以上の研究</text>
  <text x="92" y="377" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・25研究 / 1735例</text>
  <text x="92" y="419" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・1768動脈瘤</text>
  <text x="92" y="461" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・破裂瘤 30.1%</text>

  <rect x="565" y="190" width="470" height="305" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="597" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0e7490">適切閉塞率</text>
  <text x="597" y="295" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">1年 87.3%</text>
  <text x="597" y="342" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">1-2年 90.7%</text>
  <text x="597" y="389" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">3年 93.3%</text>
  <text x="597" y="436" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">5年 88.4%</text>
  <polyline points="805,435 870,380 935,328 1000,360" fill="none" stroke="#0e7490" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1070" y="190" width="470" height="305" rx="16" fill="#fff7ed" stroke="#f1a768" stroke-width="3"/>
  <text x="1102" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#9a3412">長期安全性</text>
  <text x="1102" y="302" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#7c2d12">・再治療率 7.2%</text>
  <text x="1102" y="354" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#7c2d12">・1年以降のデバイス関連有害事象なし</text>
  <text x="1102" y="406" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#7c2d12">・遅発性破裂 / 再出血なし</text>
  <text x="1102" y="458" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#7c2d12">・破裂/未破裂とも良好</text>

  <rect x="60" y="525" width="1480" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="575" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" font-weight="700" fill="#0f172a">臨床的Take-home</text>
  <text x="92" y="624" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">・WEBは長期追跡でも適切閉塞率が高く、再治療率は低い。</text>
  <text x="92" y="666" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">・1年以降の遅発性破裂やデバイス関連有害事象が報告されず、長期安全性を支持。</text>

  <rect x="60" y="734" width="710" height="105" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="92" y="780" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="26" font-weight="700" fill="#0e7490">Durable occlusion</text>
  <text x="92" y="818" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="24" fill="#155e75">1-5年で約87-93%の適切閉塞</text>

  <rect x="830" y="734" width="710" height="105" rx="12" fill="#fff7ed" stroke="#f1a768" stroke-width="2"/>
  <text x="862" y="780" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="26" font-weight="700" fill="#9a3412">Long-term safety</text>
  <text x="862" y="818" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="24" fill="#7c2d12">1年以降の処置/デバイス関連有害事象なし</text>

  <text x="60" y="875" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="20" fill="#64748b">Palmisano V, Ganimede MP, Diana F, et al. J NeuroIntervent Surg. 2026. PMID: 40764017</text>
</svg>
