<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect x="0" y="0" width="1600" height="124" fill="#143f4a"/><text x="60" y="57" font-size="38" fill="#ffffff" font-weight="850">超早期RIPCはEVT後転帰を改善せず</text><text x="60" y="99" font-size="24" fill="#cfecee" font-weight="650">EnTRIPS / 中国8施設RCT</text><text x="1376" y="73" font-size="23" fill="#ffffff" font-weight="750">PMID: 42267436</text><rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/><text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text><text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">LVO + EVT再開通成功</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">270例を無作為化</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">発症24時間以内</text><circle cx="408" cy="390" r="45" fill="#65aaa4" opacity="0.24"/><path d="M379 398 c14 -38 44 -38 58 0" fill="none" stroke="#11635d" stroke-width="8" stroke-linecap="round"/><circle cx="408" cy="362" r="22" fill="#11635d" opacity="0.85"/><rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/><text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">方法・比較</text><text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">EVT後6時間以内に開始</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">両上腕カフ5サイクル x 7日</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">標準治療単独と比較</text><path d="M736 392 h126" stroke="#8a5905" stroke-width="12" stroke-linecap="round"/><path d="M844 358 l52 34 -52 34" fill="none" stroke="#8a5905" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text><text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">90日mRS 0-2</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">60.9% vs 57.8%</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">aRR 1.07 / P=0.46</text><path d="M1414 388 l28 30 l58 -78" fill="none" stroke="#9a312c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><rect x="566" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><rect x="1072" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">機能的自立は</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">有意に増えない</text><text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">関連有害事象</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">7.5%</text><text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">安全だが有効性は</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">示されず</text><rect x="60" y="722" width="1480" height="98" rx="18" fill="#143f4a"/><text x="92" y="765" font-size="25" fill="#ffffff" font-weight="850">再開通後RIPCは安全に実施できるが、90日転帰改善を目的としたルーチン追加を支持する結果ではない。</text><text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 42267436</text></svg>