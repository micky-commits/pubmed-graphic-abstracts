ght="850">介入・比較</text><text x="614" y="283" font-size="27" fill="#1f3037" font-weight="700">LPS後のrevision</text><text x="614" y="319" font-size="27" fill="#1f3037" font-weight="700">感染・過剰drainage</text><text x="614" y="355" font-size="27" fill="#1f3037" font-weight="700">病態別に統合</text><g transform="translate(800 404)" fill="none" stroke="#a76a09" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-86 0H75"/><path d="M47-29l36 29-36 29"/></g><rect x="1104" y="164" width="438" height="329" rx="8" fill="#fdeeed" stroke="#dc7f74" stroke-width="3"/><circle cx="1147" cy="210" r="22" fill="#a83d35"/><text x="1147" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">3</text><text x="1185" y="219" font-size="30" fill="#94362f" font-weight="850">主要結果</text><text x="1137" y="283" font-size="27" fill="#1f3037" font-weight="700">revision 全体25%</text><text x="1137" y="319" font-size="27" fill="#1f3037" font-weight="700">NPH 10% / 交通性21%</text><text x="1137" y="355" font-size="27" fill="#1f3037" font-weight="700">IIH 46%</text><g transform="translate(1415 394)" fill="none" stroke="#a83d35" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-55 4l34 34 72-89"/></g><rect x="58" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="565" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="1072" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="58" y="530" width="9" height="137" fill="#13746b"/><rect x="565" y="530" width="9" height="137" fill="#e1a34e"/><rect x="1072" y="530" width="9" height="137" fill="#dc7f74"/><text x="91" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 1</text><text x="91" y="616" font-size="25" fill="#1f3037" font-weight="700">感染リスク</text><text x="91" y="650" font-size="25" fill="#1f3037" font-weight="700">1%</text><text x="598" y="574" font-siz