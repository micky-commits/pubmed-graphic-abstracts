<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fbfcfd"/>
  <rect x="44" y="34" width="1512" height="124" rx="18" fill="#0b5f7a"/>
  <text x="800" y="84" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="39" font-weight="800" fill="#ffffff">灌流画像で選んだ6〜16時間脳梗塞は血栓回収で機能転帰が改善</text>
  <text x="800" y="126" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="700" fill="#d7f3ff">DEFUSE 3：血栓回収 + 内科治療 vs 内科治療単独</text>
  <text x="800" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#e8fbff">Albers GW et al. NEJM 2018 / PMID: 29364767</text>

  <rect x="60" y="194" width="330" height="440" rx="16" fill="#ffffff" stroke="#86c5da" stroke-width="3"/>
  <text x="225" y="242" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="30" font-weight="800" fill="#0b5f7a">灌流画像選択</text>
  <rect x="104" y="286" width="242" height="132" rx="14" fill="#f2f8fb" stroke="#8bb8c7" stroke-width="3"/>
  <circle cx="186" cy="352" r="35" fill="#ef5548" opacity="0.88"/>
  <circle cx="186" cy="352" r="68" fill="none" stroke="#22b8cf" stroke-width="13"/>
  <text x="290" y="344" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="23" font-weight="800" fill="#102033">虚血だが</text>
  <text x="290" y="378" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="23" font-weight="800" fill="#102033">未梗塞</text>
  <text x="225" y="478" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" fill="#102033">最終健常 6〜16時間</text>
  <text x="225" y="520" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" fill="#102033">梗塞体積 &lt;70 mL</text>
  <text x="225" y="562" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" fill="#102033">ミスマッチ比 ≥1.8</text>

  <rect x="435" y="194" width="510" height="440" rx="18" fill="#ffffff" stroke="#0f7b7f" stroke-width="4"/>
  <rect x="435" y="194" width="510" height="72" rx="18" fill="#0f7b7f"/>
  <text x="690" y="242" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffffff">血管内治療 + 内科治療</text>
  <text x="690" y="307" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="700" fill="#0f7b7f">92例</text>
  <path d="M560 478 C585 400 558 352 584 308" fill="none" stroke="#bf3330" stroke-width="35" stroke-linecap="round"/>
  <path d="M630 478 C656 400 626 352 654 308" fill="none" stroke="#e05b51" stroke-width="35" stroke-linecap="round"/>
  <circle cx="630" cy="390" r="60" fill="none" stroke="#0f7b7f" stroke-width="8" stroke-dasharray="10 10"/>
  <path d="M722 390 h128" stroke="#102033" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="830" y="338" width="78" height="108" rx="14" fill="#e8f6f5" stroke="#0f7b7f" stroke-width="5"/>
  <text x="690" y="550" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#102033">38米国施設・早期終了</text>
  <text x="690" y="590" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" fill="#4b5866">有効性により中止</text>

  <rect x="990" y="194" width="510" height="440" rx="18" fill="#ffffff" stroke="#ef5548" stroke-width="4"/>
  <rect x="990" y="194" width="510" height="72" rx="18" fill="#ef5548"/>
  <text x="1245" y="242" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffffff">内科治療単独</text>
  <text x="1245" y="307" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="700" fill="#ef5548">90例</text>
  <path d="M1138 478 C1162 400 1134 352 1162 308" fill="none" stroke="#bf3330" stroke-width="35" stroke-linecap="round"/>
  <path d="M1208 478 C1232 400 1204 352 1232 308" fill="none" stroke="#e05b51" stroke-width="35" stroke-linecap="round"/>
  <rect x="1300" y="350" width="112" height="92" rx="12" fill="#fdecea" stroke="#ef5548" stroke-width="5"/>
  <text x="1245" y="550" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#102033">標準内科治療</text>
  <text x="1245" y="590" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" fill="#4b5866">近位MCA / ICA閉塞</text>

  <rect x="60" y="680" width="350" height="170" rx="14" fill="#ffffff" stroke="#0b5f7a" stroke-width="3"/>
  <rect x="60" y="680" width="350" height="58" rx="14" fill="#0b5f7a"/>
  <text x="235" y="720" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">mRS分布</text>
  <text x="235" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="41" font-weight="800" fill="#0b5f7a">OR 2.77</text>
  <text x="235" y="825" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#0b5f7a">有利なシフト</text>

  <rect x="440" y="680" width="365" height="170" rx="14" fill="#ffffff" stroke="#0f7b7f" stroke-width="3"/>
  <rect x="440" y="680" width="365" height="58" rx="14" fill="#0f7b7f"/>
  <text x="622" y="720" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">機能的自立</text>
  <text x="622" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#0f7b7f">45% vs 17%</text>
  <text x="622" y="825" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#0f7b7f">P&lt;0.001</text>

  <rect x="835" y="680" width="320" height="170" rx="14" fill="#ffffff" stroke="#ef5548" stroke-width="3"/>
  <rect x="835" y="680" width="320" height="58" rx="14" fill="#ef5548"/>
  <text x="995" y="720" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">90日死亡</text>
  <text x="995" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#ef5548">14% vs 26%</text>
  <text x="995" y="825" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#ef5548">P=0.05</text>

  <rect x="1185" y="680" width="355" height="170" rx="14" fill="#102033"/>
  <text x="1362" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#ffffff">Take-home</text>
  <text x="1362" y="788" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#d7f3ff">灌流ミスマッチで</text>
  <text x="1362" y="826" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#d7f3ff">治療可能例を抽出</text>

  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#102033"/></marker></defs>
</svg>
