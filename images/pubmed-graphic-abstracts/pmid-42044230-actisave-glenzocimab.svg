<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="36" y="30" width="1528" height="128" rx="18" fill="#0b5f7a"/>
  <text x="72" y="82" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="35" font-weight="700" fill="#ffffff">ACTISAVE: Glenzocimab上乗せは有効か？</text>
  <text x="72" y="125" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="23" fill="#d7f3ff">PMID: 42044230 | Stroke 2026 | randomized double-blind phase 2/3 trial</text>

  <rect x="60" y="190" width="470" height="305" rx="16" fill="#ffffff" stroke="#86c5da" stroke-width="3"/>
  <text x="92" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0b5f7a">試験設計</text>
  <text x="92" y="293" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・国際多施設RCT</text>
  <text x="92" y="335" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・二重盲検 placebo対照</text>
  <text x="92" y="377" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・10か国54施設</text>
  <text x="92" y="419" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・IVT ± MT のAIS</text>
  <text x="92" y="461" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#0f172a">・解析対象 421例</text>

  <rect x="565" y="190" width="470" height="305" rx="16" fill="#fff7ed" stroke="#f1a768" stroke-width="3"/>
  <text x="597" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#9a3412">介入</text>
  <text x="597" y="302" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="31" font-weight="700" fill="#7c2d12">Glenzocimab 1000 mg IV</text>
  <text x="597" y="354" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#7c2d12">GPVI阻害で血小板活性化を抑制</text>
  <text x="597" y="406" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#7c2d12">血栓溶解開始後中央値1.2時間で投与</text>
  <text x="597" y="458" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="27" fill="#7c2d12">MT併用 36%</text>

  <rect x="1070" y="190" width="470" height="305" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="1102" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0e7490">主要結果</text>
  <text x="1102" y="300" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">90日 poor outcome mRS 4-6</text>
  <text x="1102" y="358" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="46" font-weight="700" fill="#0e7490">21.6%</text>
  <text x="1270" y="358" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">vs 15.3%</text>
  <text x="1102" y="414" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">OR 1.51 (95%CI 0.90-2.54)</text>
  <text x="1102" y="458" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">主要評価項目は未達</text>

  <rect x="60" y="525" width="1480" height="176" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="575" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" font-weight="700" fill="#0f172a">臨床的Take-home</text>
  <text x="92" y="624" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">・IVT ± MTへのglenzocimab上乗せは、90日mRS改善を確認できなかった。</text>
  <text x="92" y="666" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">・ACTIMISで期待された出血/死亡低減シグナルは、確認試験ACTISAVEでは臨床利益に結びつかず。</text>

  <rect x="60" y="734" width="710" height="105" rx="12" fill="#fff7ed" stroke="#f1a768" stroke-width="2"/>
  <text x="92" y="780" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="26" font-weight="700" fill="#9a3412">Primary endpoint</text>
  <text x="92" y="818" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="24" fill="#7c2d12">90日mRS 4-6の低下を示せず</text>

  <rect x="830" y="734" width="710" height="105" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="862" y="780" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="26" font-weight="700" fill="#0e7490">Practice impact</text>
  <text x="862" y="818" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="24" fill="#155e75">現時点で標準治療への上乗せ根拠なし</text>

  <text x="60" y="875" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="20" fill="#64748b">Köhrmann M, Berrouschot J, Serena J, et al. Stroke. 2026. PMID: 42044230</text>
</svg>
