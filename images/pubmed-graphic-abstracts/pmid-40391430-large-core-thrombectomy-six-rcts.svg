<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">Large Core MT: 6つのRCTを批判的に読む</text><text x="60" y="98" class="sub" fill="#c9eceb">大梗塞コアへの血栓回収適応拡大と、画像ワークフロー・医療体制への影響</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 40391430</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象テーマ</text><text x="84" y="242" class="t">large ischemic core</text><text x="84" y="276" class="t">急性虚血性脳卒中</text><text x="84" y="310" class="t">EVTの有効性・安全性</text><text x="84" y="344" class="t">6 RCTを整理</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">6 RCT</text><text x="540" y="244" class="t ink">RESCUE-Japan LIMIT / ANGEL-ASPECT / SELECT2</text><text x="540" y="284" class="t ink">TENSION / TESLA / LASTE</text><text x="540" y="334" class="s muted">臨床基準・画像基準・時間窓がそれぞれ異なる</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">論点</text><text x="1180" y="242" class="t">ASPECTS / core volume</text><text x="1180" y="276" class="t">年齢・NIHSS・時間窓</text><text x="1180" y="310" class="t">CT vs MRI / perfusion</text><text x="1180" y="344" class="t">stroke systemへの影響</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="558" y="432" class="s muted">「large coreなら全員EVT」ではなく、試験条件と自施設導線を照合</text><rect x="80" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="108" y="528" class="h teal">有効性</text><text x="108" y="576" class="num teal">支持</text><text x="108" y="606" class="xs muted">複数RCTでMT有益性</text><rect x="446" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="474" y="528" class="h amber">画像基準</text><text x="474" y="576" class="num amber">多様</text><text x="474" y="606" class="xs muted">ASPECTS/core volume差</text><rect x="812" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="840" y="528" class="h blue">subgroup</text><text x="840" y="576" class="num blue">要注意</text><text x="840" y="606" class="xs muted">個別患者メタ解析待ち</text><rect x="1178" y="484" width="342" height="142" rx="18" class="coralCard"/><text x="1206" y="528" class="h coral">体制</text><text x="1206" y="576" class="num coral">負荷増</text><text x="1206" y="606" class="xs muted">適応拡大で搬送・画像が変化</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">large coreでもEVTを検討する時代へ。</text><text x="96" y="786" class="t">ただしASPECTS、灌流、年齢、時間、虚血範囲で適応の濃淡がある。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">実装上の注意</text><text x="862" y="754" class="t">画像ワークフローを複雑にしすぎると再灌流が遅れる。</text><text x="862" y="786" class="t">社会的便益と医療資源負荷を同時に評価。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: large core MTは有望だが、試験ごとの選択基準差を理解して実装する。</text></svg>