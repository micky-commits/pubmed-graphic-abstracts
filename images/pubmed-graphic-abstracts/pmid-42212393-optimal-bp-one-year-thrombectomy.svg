<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect x="0" y="0" width="1600" height="124" fill="#143f4a"/><text x="60" y="57" font-size="38" fill="#ffffff" font-weight="850">EVT後の厳格降圧は1年転帰も不利</text><text x="60" y="99" font-size="24" fill="#cfecee" font-weight="650">OPTIMAL-BP / 韓国19施設RCT長期追跡</text><text x="1376" y="73" font-size="23" fill="#ffffff" font-weight="750">PMID: 42212393</text><rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/><text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text><text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">再開通成功 + SBP &gt;=140</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">無作為化306例</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">1年追跡294例</text><circle cx="408" cy="390" r="45" fill="#65aaa4" opacity="0.24"/><path d="M379 398 c14 -38 44 -38 58 0" fill="none" stroke="#11635d" stroke-width="8" stroke-linecap="round"/><circle cx="408" cy="362" r="22" fill="#11635d" opacity="0.85"/><rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/><text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">方法・比較</text><text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">SBP &lt;140 mmHg</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">vs 140-180 mmHg</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">24時間管理後の1年転帰</text><path d="M736 392 h126" stroke="#8a5905" stroke-width="12" stroke-linecap="round"/><path d="M844 358 l52 34 -52 34" fill="none" stroke="#8a5905" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text><text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">mRS 0-2: 40.5% vs 52.7%</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">aOR 0.59［0.34-1.00］</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">死亡率に差なし</text><path d="M1414 388 l28 30 l58 -78" fill="none" stroke="#9a312c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><rect x="566" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><rect x="1072" y="536" width="468" height="138" rx="14" fill="#ffffff" stroke="#d8e5e5" stroke-width="3"/><text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">短期の害が</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">長期回復にも持続</text><text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">再開通後の灌流を</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">下げすぎない</text><text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">一律SBP &lt;140を</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">避ける根拠</text><rect x="60" y="722" width="1480" height="98" rx="18" fill="#143f4a"/><text x="92" y="765" font-size="25" fill="#ffffff" font-weight="850">再開通成功後も一律にSBP 140 mmHg未満を目標とせず、脳灌流を保つ従来範囲で慎重に管理する。</text><text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 42212393</text></svg>