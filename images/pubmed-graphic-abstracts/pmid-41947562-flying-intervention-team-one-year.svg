<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">Flying Intervention Team: 地方MTアクセスの再設計</text><text x="60" y="98" class="sub" fill="#c9eceb">患者を送るか、術者チームを飛ばすか。12か月機能転帰を評価</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 41947562</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象</text><text x="84" y="242" class="t">Bavaria 非都市部PSC 13施設</text><text x="84" y="276" class="t">登録157例 / 解析146例</text><text x="84" y="310" class="t">2018-2019</text><text x="84" y="344" class="t">12か月追跡</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">2つのシステム</text><rect x="534" y="236" width="250" height="108" rx="16" class="blueCard"/><text x="560" y="276" class="h blue">Flying team</text><text x="560" y="316" class="s ink">術者がPSCへ移動</text><rect x="834" y="236" width="250" height="108" rx="16" class="amberCard"/><text x="860" y="276" class="h amber">Transfer</text><text x="860" y="316" class="s ink">患者がCSCへ搬送</text><path d="M790 290 L830 290" stroke="#49636b" stroke-width="5" marker-end="url(#arrow)"/><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">研究デザイン</text><text x="1180" y="242" class="t">多施設 pseudo-randomized</text><text x="1180" y="276" class="t">交互週でシステム切替</text><text x="1180" y="310" class="t">primary: 12か月mRS</text><text x="1180" y="344" class="t">QOL・ADL・死亡も評価</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="558" y="432" class="s muted">MTアクセス格差を、救急搬送設計そのものから改善する試み</text><rect x="80" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="108" y="528" class="h blue">穿刺まで</text><text x="108" y="576" class="num blue">-89分</text><text x="108" y="606" class="xs muted">decision-to-puncture短縮</text><rect x="446" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="474" y="528" class="h teal">12か月mRS</text><text x="474" y="576" class="num teal">良好</text><text x="474" y="606" class="xs muted">adjusted common OR 2.03</text><rect x="812" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="840" y="528" class="h amber">QOL</text><text x="840" y="576" class="num amber">改善</text><text x="840" y="606" class="xs muted">EQ-5D 0.79 vs 0.68</text><rect x="1178" y="484" width="342" height="142" rx="18" class="card"/><text x="1206" y="528" class="h deep">死亡/合併症</text><text x="1206" y="576" class="num deep">差なし</text><text x="1206" y="606" class="xs muted">有意差なし</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">地方のMTでは、病院間搬送時間が転帰を左右する。</text><text x="96" y="786" class="t">術者派遣モデルは、広域医療圏での選択肢になり得る。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">疑似ランダム化であり、完全なRCTではない。</text><text x="862" y="786" class="t">運用には人員、ヘリ/車両、24時間体制、費用の検討が必要。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: 地方では、患者搬送だけでなく専門チーム派遣が長期転帰を改善し得る。</text></svg>