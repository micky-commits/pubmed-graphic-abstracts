<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="126" fill="#143f4a"/><rect x="0" y="126" width="1600" height="8" fill="#ed826f"/><text x="58" y="58" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="39" fill="#fff" font-weight="850">A1低形成は基底核梗塞と出血を増やす</text><text x="58" y="101" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="23" fill="#cfecee" font-weight="650">MCA閉塞血栓回収 / CTAで読める解剖学的リスク</text><rect x="1370" y="31" width="174" height="58" rx="7" fill="#ffffff" opacity="0.12"/><text x="1457" y="67" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif" font-size="21" fill="#fff" font-weight="800">PMID 42418306</text><rect x="58" y="164" width="438" height="329" rx="8" fill="#e8f6f2" stroke="#68aaa3" stroke-width="3"/><circle cx="101" cy="210" r="22" fill="#13746b"/><text x="101" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">1</text><text x="139" y="219" font-size="30" fill="#105f59" font-weight="850">対象・研究設計</text><text x="91" y="283" font-size="27" fill="#1f3037" font-weight="700">MCA閉塞EVT 236例</text><text x="91" y="319" font-size="27" fill="#1f3037" font-weight="700">A1低形成・欠損 15.3%</text><text x="91" y="355" font-size="27" fill="#1f3037" font-weight="700">別途300例でLSA評価</text><g transform="translate(344 386)" fill="none" stroke="#13746b" stroke-width="9" stroke-linecap="round"><circle cx="0" cy="-35" r="23" fill="#bfe3dc"/><path d="M-45 48c8-48 82-48 90 0"/><path d="M-82 44c4-30 37-39 55-22M82 44c-4-30-37-39-55-22" opacity=".55"/></g><rect x="581" y="164" width="438" height="329" rx="8" fill="#fff7e9" stroke="#e1a34e" stroke-width="3"/><circle cx="624" cy="210" r="22" fill="#a76a09"/><text x="624" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">2</text><text x="662" y="219" font-size="30" fill="#835304" font-weight="850">介入・比較</text><text x="614" y="283" font-size="27" fill="#1f3037" font-weight="700">治療前CTAでA1形態</text><text x="614" y="319" font-size="27" fill="#1f3037" font-weight="700">72時間画像で基底核梗塞</text><text x="614" y="355" font-size="27" fill="#1f3037" font-weight="700">出血性変化との関連</text><g transform="translate(800 404)" fill="none" stroke="#a76a09" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-86 0H75"/><path d="M47-29l36 29-36 29"/></g><rect x="1104" y="164" width="438" height="329" rx="8" fill="#fdeeed" stroke="#dc7f74" stroke-width="3"/><circle cx="1147" cy="210" r="22" fill="#a83d35"/><text x="1147" y="219" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">3</text><text x="1185" y="219" font-size="30" fill="#94362f" font-weight="850">主要結果</text><text x="1137" y="283" font-size="27" fill="#1f3037" font-weight="700">梗塞 29.0 vs 25.8 cm³</text><text x="1137" y="319" font-size="27" fill="#1f3037" font-weight="700">出血 66.7% vs 34.0%</text><text x="1137" y="355" font-size="27" fill="#1f3037" font-weight="700">HT aOR 3.06</text><g transform="translate(1415 394)" fill="none" stroke="#a83d35" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M-55 4l34 34 72-89"/></g><rect x="58" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="565" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="1072" y="530" width="470" height="137" rx="8" fill="#fff" stroke="#d7e4e4" stroke-width="3"/><rect x="58" y="530" width="9" height="137" fill="#13746b"/><rect x="565" y="530" width="9" height="137" fill="#e1a34e"/><rect x="1072" y="530" width="9" height="137" fill="#dc7f74"/><text x="91" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 1</text><text x="91" y="616" font-size="25" fill="#1f3037" font-weight="700">内側LSA発達が</text><text x="91" y="650" font-size="25" fill="#1f3037" font-weight="700">乏しい</text><text x="598" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 2</text><text x="598" y="616" font-size="25" fill="#1f3037" font-weight="700">梗塞体積が</text><text x="598" y="650" font-size="25" fill="#1f3037" font-weight="700">効果の44%を媒介</text><text x="1105" y="574" font-size="22" fill="#60747a" font-weight="800">KEY FINDING 3</text><text x="1105" y="616" font-size="25" fill="#1f3037" font-weight="700">CTAで術後出血を</text><text x="1105" y="650" font-size="25" fill="#1f3037" font-weight="700">リスク層別化</text><rect x="58" y="710" width="1484" height="112" rx="8" fill="#143f4a"/><rect x="58" y="710" width="218" height="112" rx="8" fill="#ed826f"/><text x="167" y="760" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">CLINICAL</text><text x="167" y="793" text-anchor="middle" font-size="25" fill="#fff" font-weight="850">TAKE-HOME</text><text x="309" y="758" font-size="25" fill="#fff" font-weight="820">MCA閉塞では治療前CTAのA1低形成・欠損を確認し、基底核梗塞拡大と出血性変化の高リスク所見</text><text x="309" y="790" font-size="25" fill="#fff" font-weight="820">として扱う。</text><text x="58" y="866" font-size="18" fill="#63777d">Japanese graphical abstract / PubMed新着文献アラート / 2026-07-30 / PMID 42418306</text></svg>