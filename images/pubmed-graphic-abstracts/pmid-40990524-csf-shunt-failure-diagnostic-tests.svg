<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="122" fill="#143f4a"/><text x="60" y="57" font-size="39" fill="#fff" font-weight="850">シャント不全診断の検査性能</text><text x="60" y="98" font-size="24" fill="#cfecee" font-weight="650">非侵襲・低侵襲検査の系統的レビュー</text><text x="1376" y="72" font-size="23" fill="#fff" font-weight="750">PMID: 40990524</text><rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/><text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text><text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">33研究を解析</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">小児・成人</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">永久CSFシャント対象</text><rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/><text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">方法・比較</text><text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">X線シャントシリーズ</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">CT・MRI・核医学検査</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">熱流量評価を比較</text><rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text><text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">X線はCTより感度低い</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">特異度は高い</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">単独で十分な検査なし</text><path d="M520 335h45m-10-20l25 20-25 20M1039 335h45m-10-20l25 20-25 20" fill="none" stroke="#53656d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><rect x="566" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><rect x="1072" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">単一検査で</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">除外・確定は困難</text><text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">X線は特異度寄り</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">CTは感度寄り</text><text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">臨床所見と</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">複数検査の統合が重要</text><rect x="60" y="722" width="1480" height="94" rx="18" fill="#143f4a"/><text x="92" y="780" font-size="30" fill="#fff" font-weight="850">シャント不全は単独検査で決めず、症状・画像・経過を統合して判断する。</text><text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 40990524</text></svg>
