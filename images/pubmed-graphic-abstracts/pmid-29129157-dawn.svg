<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fbfcfd"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="45" font-weight="800" fill="#102033">最終健常6〜24時間でもミスマッチ例は血栓回収で自立率が大幅改善</text>
  <text x="800" y="120" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="31" font-weight="700" fill="#0f7b7f">DAWN：血栓回収 + 標準治療 vs 標準治療単独</text>
  <text x="800" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#56616f">Nogueira RG et al. NEJM 2018 / PMID: 29129157</text>

  <rect x="60" y="198" width="310" height="444" rx="16" fill="#ffffff" stroke="#c7d2de" stroke-width="3"/>
  <text x="215" y="248" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="30" font-weight="800" fill="#102033">選択基準</text>
  <circle cx="215" cy="330" r="58" fill="#e8f6f5" stroke="#0f7b7f" stroke-width="8"/>
  <text x="215" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#0f7b7f">6-24h</text>
  <text x="215" y="430" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" fill="#102033">ICA / 近位MCA閉塞</text>
  <rect x="104" y="474" width="222" height="118" rx="14" fill="#f4f7fa" stroke="#a8b4c0" stroke-width="3"/>
  <circle cx="166" cy="533" r="32" fill="#ef5548" opacity="0.85"/>
  <circle cx="166" cy="533" r="54" fill="none" stroke="#0f7b7f" stroke-width="10"/>
  <text x="250" y="526" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#102033">臨床症状</text>
  <text x="250" y="563" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#102033">梗塞体積</text>

  <rect x="420" y="198" width="515" height="444" rx="18" fill="#ffffff" stroke="#0f7b7f" stroke-width="4"/>
  <rect x="420" y="198" width="515" height="72" rx="18" fill="#0f7b7f"/>
  <text x="678" y="246" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffffff">血栓回収 + 標準治療</text>
  <text x="678" y="312" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="700" fill="#0f7b7f">107例</text>
  <path d="M548 482 C572 404 545 354 570 310" fill="none" stroke="#bf3330" stroke-width="35" stroke-linecap="round"/>
  <path d="M618 482 C642 404 614 354 642 310" fill="none" stroke="#e05b51" stroke-width="35" stroke-linecap="round"/>
  <circle cx="618" cy="394" r="58" fill="none" stroke="#0f7b7f" stroke-width="8" stroke-dasharray="10 10"/>
  <path d="M710 394 h128" stroke="#102033" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="820" y="340" width="78" height="110" rx="14" fill="#e8f6f5" stroke="#0f7b7f" stroke-width="5"/>
  <text x="678" y="555" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#102033">ミスマッチを救済対象に</text>
  <text x="678" y="594" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" fill="#4b5866">登録は中間解析で早期終了</text>

  <rect x="985" y="198" width="515" height="444" rx="18" fill="#ffffff" stroke="#ef5548" stroke-width="4"/>
  <rect x="985" y="198" width="515" height="72" rx="18" fill="#ef5548"/>
  <text x="1243" y="246" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="30" font-weight="800" fill="#ffffff">標準治療単独</text>
  <text x="1243" y="312" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="700" fill="#ef5548">99例</text>
  <path d="M1136 482 C1160 404 1132 354 1160 310" fill="none" stroke="#bf3330" stroke-width="35" stroke-linecap="round"/>
  <path d="M1206 482 C1230 404 1202 354 1230 310" fill="none" stroke="#e05b51" stroke-width="35" stroke-linecap="round"/>
  <rect x="1300" y="354" width="110" height="88" rx="12" fill="#fdecea" stroke="#ef5548" stroke-width="5"/>
  <text x="1243" y="555" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#102033">保存的標準治療</text>
  <text x="1243" y="594" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" fill="#4b5866">発症時刻だけでは選別しない</text>

  <rect x="60" y="680" width="350" height="170" rx="14" fill="#ffffff" stroke="#143b66" stroke-width="3"/>
  <rect x="60" y="680" width="350" height="58" rx="14" fill="#143b66"/>
  <text x="235" y="720" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">障害スコア</text>
  <text x="235" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#143b66">5.5 vs 3.4</text>
  <text x="235" y="825" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#143b66">utility-weighted mRS</text>

  <rect x="440" y="680" width="365" height="170" rx="14" fill="#ffffff" stroke="#0f7b7f" stroke-width="3"/>
  <rect x="440" y="680" width="365" height="58" rx="14" fill="#0f7b7f"/>
  <text x="622" y="720" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">機能的自立</text>
  <text x="622" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#0f7b7f">49% vs 13%</text>
  <text x="622" y="825" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#0f7b7f">大きな絶対差</text>

  <rect x="835" y="680" width="320" height="170" rx="14" fill="#ffffff" stroke="#ef5548" stroke-width="3"/>
  <rect x="835" y="680" width="320" height="58" rx="14" fill="#ef5548"/>
  <text x="995" y="720" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">症候性頭蓋内出血</text>
  <text x="995" y="785" text-anchor="middle" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#ef5548">6% vs 3%</text>
  <text x="995" y="825" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#ef5548">有意差なし</text>

  <rect x="1185" y="680" width="355" height="170" rx="14" fill="#102033"/>
  <text x="1362" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#ffffff">Take-home</text>
  <text x="1362" y="788" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#d7f3ff">時間窓を画像選択で</text>
  <text x="1362" y="826" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#d7f3ff">24時間まで拡張</text>

  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#102033"/></marker></defs>
</svg>
