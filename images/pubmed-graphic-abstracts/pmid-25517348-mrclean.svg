<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fbfcfd"/>
  <rect x="40" y="32" width="1520" height="132" rx="18" fill="#102033"/>
  <text x="800" y="83" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#ffffff">近位前方循環閉塞：6時間以内の動脈内治療で機能転帰が改善</text>
  <text x="800" y="128" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="700" fill="#c7f2ef">MR CLEAN：動脈内治療 + 通常治療 vs 通常治療単独</text>
  <text x="800" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#dce4ec">Berkhemer OA et al. NEJM 2015 / PMID: 25517348</text>

  <rect x="60" y="198" width="300" height="430" rx="16" fill="#ffffff" stroke="#c7d2de" stroke-width="3"/>
  <text x="210" y="248" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="31" font-weight="800" fill="#102033">多施設RCT</text>
  <text x="210" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#0f7b7f">500</text>
  <text x="210" y="333" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="700" fill="#102033">例・16施設</text>
  <circle cx="150" cy="400" r="24" fill="#86c7c4"/><circle cx="210" cy="400" r="24" fill="#ef8b80"/><circle cx="270" cy="400" r="24" fill="#86c7c4"/>
  <rect x="130" y="430" width="40" height="56" rx="9" fill="#86c7c4"/><rect x="190" y="430" width="40" height="56" rx="9" fill="#ef8b80"/><rect x="250" y="430" width="40" height="56" rx="9" fill="#86c7c4"/>
  <text x="210" y="545" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" fill="#4b5866">発症6時間以内</text>
  <text x="210" y="586" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" fill="#4b5866">近位前方循環閉塞</text>

  <rect x="405" y="198" width="520" height="430" rx="18" fill="#ffffff" stroke="#0f7b7f" stroke-width="4"/>
  <rect x="405" y="198" width="520" height="72" rx="18" fill="#0f7b7f"/>
  <text x="665" y="246" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="31" font-weight="800" fill="#ffffff">動脈内治療 + 通常治療</text>
  <text x="665" y="310" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="700" fill="#0f7b7f">233例</text>
  <path d="M540 455 C565 380 535 338 560 300" fill="none" stroke="#c23632" stroke-width="34" stroke-linecap="round"/>
  <path d="M610 455 C636 380 604 338 632 300" fill="none" stroke="#e05b51" stroke-width="34" stroke-linecap="round"/>
  <circle cx="592" cy="384" r="58" fill="none" stroke="#0f7b7f" stroke-width="8" stroke-dasharray="10 10"/>
  <path d="M690 382 h130" stroke="#102033" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="804" y="326" width="74" height="112" rx="14" fill="#e8f6f5" stroke="#0f7b7f" stroke-width="5"/>
  <text x="665" y="552" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="29" font-weight="800" fill="#102033">ステントリトリーバー主体</text>
  <text x="665" y="590" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" fill="#4b5866">血管内再開通を追加</text>

  <rect x="980" y="198" width="520" height="430" rx="18" fill="#ffffff" stroke="#ef5548" stroke-width="4"/>
  <rect x="980" y="198" width="520" height="72" rx="18" fill="#ef5548"/>
  <text x="1240" y="246" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="31" font-weight="800" fill="#ffffff">通常治療単独</text>
  <text x="1240" y="310" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="700" fill="#ef5548">267例</text>
  <path d="M1140 455 C1164 380 1134 338 1160 300" fill="none" stroke="#c23632" stroke-width="34" stroke-linecap="round"/>
  <path d="M1210 455 C1236 380 1204 338 1232 300" fill="none" stroke="#e05b51" stroke-width="34" stroke-linecap="round"/>
  <rect x="1310" y="342" width="92" height="96" rx="14" fill="#fdecea" stroke="#ef5548" stroke-width="5"/>
  <line x1="1326" y1="358" x2="1386" y2="422" stroke="#ef5548" stroke-width="8"/>
  <line x1="1386" y1="358" x2="1326" y2="422" stroke="#ef5548" stroke-width="8"/>
  <text x="1240" y="552" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="29" font-weight="800" fill="#102033">標準内科治療</text>
  <text x="1240" y="590" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" fill="#4b5866">多くは静注アルテプラーゼ併用</text>

  <rect x="60" y="674" width="360" height="174" rx="14" fill="#ffffff" stroke="#143b66" stroke-width="3"/>
  <rect x="60" y="674" width="360" height="58" rx="14" fill="#143b66"/>
  <text x="240" y="714" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">主要転帰</text>
  <text x="240" y="780" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="29" font-weight="800" fill="#143b66">90日mRSシフト</text>
  <text x="240" y="824" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#143b66">OR 1.67</text>

  <rect x="450" y="674" width="360" height="174" rx="14" fill="#ffffff" stroke="#0f7b7f" stroke-width="3"/>
  <rect x="450" y="674" width="360" height="58" rx="14" fill="#0f7b7f"/>
  <text x="630" y="714" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">機能的自立</text>
  <text x="630" y="782" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#0f7b7f">32.6% vs 19.1%</text>
  <text x="630" y="824" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="800" fill="#0f7b7f">絶対差 13.5ポイント</text>

  <rect x="840" y="674" width="330" height="174" rx="14" fill="#ffffff" stroke="#ef5548" stroke-width="3"/>
  <rect x="840" y="674" width="330" height="58" rx="14" fill="#ef5548"/>
  <text x="1005" y="714" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" font-weight="800" fill="#ffffff">安全性</text>
  <text x="1005" y="780" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#ef5548">死亡・症候性出血</text>
  <text x="1005" y="824" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="25" font-weight="800" fill="#ef5548">有意差なし</text>

  <rect x="1200" y="674" width="340" height="174" rx="14" fill="#102033"/>
  <text x="1370" y="724" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#ffffff">Take-home</text>
  <text x="1370" y="782" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#d7f3ff">血栓回収時代の</text>
  <text x="1370" y="820" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="27" font-weight="800" fill="#d7f3ff">幕開けとなったRCT</text>

  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#102033"/></marker></defs>
</svg>
