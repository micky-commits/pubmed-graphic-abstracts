<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="122" fill="#143f4a"/><text x="60" y="57" font-size="39" fill="#fff" font-weight="850">Large Core EVTと浮腫軽減</text><text x="60" y="98" font-size="24" fill="#cfecee" font-weight="650">TENSION二次解析でみるEVT有益性の機序</text><text x="1376" y="72" font-size="23" fill="#fff" font-weight="750">PMID: 42241572</text><rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/><text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text><text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">TENSION二次解析</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">ASPECTS 3-5</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">177例</text><rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/><text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">評価</text><text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">CT net water uptake</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">ΔNWUとΔASPECTS</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">90日mRS媒介解析</text><rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text><text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">ΔNWU 4.7% vs 15.9%</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">EVT効果の34%を説明</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">病変範囲変化は14%</text><path d="M520 335h45m-10-20l25 20-25 20M1039 335h45m-10-20l25 20-25 20" fill="none" stroke="#53656d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><rect x="566" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><rect x="1072" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">EVTは浮腫進展を</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">大きく抑制</text><text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">水分増加抑制が</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">転帰改善に寄与</text><text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">large coreでも</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">再灌流の意義あり</text><rect x="60" y="722" width="1480" height="94" rx="18" fill="#143f4a"/><text x="92" y="780" font-size="30" fill="#fff" font-weight="850">EVT効果は梗塞範囲だけでなく浮腫抑制にも支えられる。</text><text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 42241572</text></svg>
