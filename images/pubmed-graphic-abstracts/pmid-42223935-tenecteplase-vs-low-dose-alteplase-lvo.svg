  <text x="60" y="57" font-size="39" fill="#ffffff" font-weight="850">LVO脳卒中: TNK vs 低用量rt-PA</text>
  <text x="60" y="98" font-size="24" fill="#cfecee" font-weight="650">MT予定例で初回造影再灌流を高めるか</text>
