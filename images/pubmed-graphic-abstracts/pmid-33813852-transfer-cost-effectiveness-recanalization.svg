<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fbfcfd"/><rect x="40" y="35" width="1520" height="130" rx="18" fill="#102033"/><text x="800" y="88" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="40" font-weight="800" fill="#fff">IVT再開通確率は転送の費用対効果を左右する</text><text x="800" y="132" text-anchor="middle" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="28" fill="#e8f6ef">Schlemm et al. / PMID:33813852</text><rect x="85" y="225" width="660" height="355" rx="18" fill="#fff" stroke="#287d5a" stroke-width="5"/><text x="415" y="300" text-anchor="middle" font-size="34" font-weight="800" font-family="Arial,'Hiragino Sans','Yu Gothic'" fill="#287d5a">Emergency transfer</text><text x="415" y="370" text-anchor="middle" font-size="42" font-weight="800" font-family="Arial" fill="#287d5a">dominant〜</text><text x="415" y="430" text-anchor="middle" font-size="30" font-family="Arial,'Hiragino Sans','Yu Gothic'">若年では概ね有利</text><rect x="855" y="225" width="660" height="355" rx="18" fill="#fff" stroke="#5f6b7a" stroke-width="5"/><text x="1185" y="300" text-anchor="middle" font-size="34" font-weight="800" font-family="Arial,'Hiragino Sans','Yu Gothic'" fill="#5f6b7a">高再開通予測</text><text x="1185" y="370" text-anchor="middle" font-size="42" font-weight="800" font-family="Arial" fill="#5f6b7a">〜$310k/QALY</text><text x="1185" y="430" text-anchor="middle" font-size="30" font-family="Arial,'Hiragino Sans','Yu Gothic'">高齢・重症で不利な場合</text><rect x="80" y="655" width="1440" height="150" rx="16" fill="#102033"/><text x="800" y="735" text-anchor="middle" font-size="34" font-weight="800" font-family="Arial,'Hiragino Sans','Yu Gothic'" fill="#e8f6ef">転送判断は再開通確率と患者背景で変わる</text></svg>