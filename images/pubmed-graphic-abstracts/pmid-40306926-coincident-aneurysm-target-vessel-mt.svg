<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">標的血管上の偶発頭蓋内動脈瘤とMT</text><text x="60" y="98" class="sub" fill="#c9eceb">多施設症例対照研究: 効果は同等、破裂リスクをどう扱うか</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 40306926</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象</text><text x="84" y="242" class="t">AISでMT施行</text><text x="84" y="276" class="t">標的血管上の偶発動脈瘤</text><text x="84" y="310" class="t">CIA群 104例</text><text x="84" y="344" class="t">対照 416例</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">手技上の問題</text><path d="M560 298 C660 230,760 230,860 298 S1020 350,1060 286" fill="none" stroke="#8fb8bd" stroke-width="20" stroke-linecap="round"/><path d="M560 298 C660 230,760 230,860 298 S1020 350,1060 286" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/><circle cx="790" cy="260" r="38" fill="#fdebea" stroke="#c7514a" stroke-width="5"/><circle cx="925" cy="302" r="22" fill="#c7514a"/><text x="560" y="356" class="s muted">瘤を横目に、血栓・デバイス・吸引を操作するリスク</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">主要評価</text><text x="1180" y="242" class="t">3か月良好転帰</text><text x="1180" y="276" class="t">mTICI ≥2b再開通</text><text x="1180" y="310" class="t">手技中の動脈瘤破裂</text><text x="1180" y="344" class="t">サイズ・部位の考慮が課題</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="564" y="432" class="s muted">転帰は同等でも、まれな破裂イベントが臨床判断を左右する</text><rect x="80" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="108" y="528" class="h teal">良好転帰</text><text x="108" y="576" class="num teal">42.4%</text><text x="108" y="606" class="xs muted">対照 41.0% / 有意差なし</text><rect x="446" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="474" y="528" class="h blue">再開通</text><text x="474" y="576" class="num blue">90.0%</text><text x="474" y="606" class="xs muted">対照 85.9% / 有意差なし</text><rect x="812" y="484" width="342" height="142" rx="18" class="coralCard"/><text x="840" y="528" class="h coral">破裂</text><text x="840" y="576" class="num coral">5.8%</text><text x="840" y="606" class="xs muted">CIA群で発生</text><rect x="1178" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="1206" y="528" class="h amber">結論</text><text x="1206" y="576" class="num amber">MT可</text><text x="1206" y="606" class="xs muted">ただし計画が重要</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">偶発動脈瘤だけでMTを諦める根拠にはなりにくい。</text><text x="96" y="786" class="t">通過回数、ステント展開、吸引位置、抗血栓薬を慎重に設計。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">瘤サイズ・形状・部位別のリスク層別化は今後の課題。</text><text x="862" y="786" class="t">破裂時のバックアッププランを持って臨む。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: 標的血管に動脈瘤があってもMTは成立し得るが、破裂リスクを前提に手技を組む。</text></svg>