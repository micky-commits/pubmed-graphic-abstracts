<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="118" fill="#153f4a"/><text x="64" y="58" font-size="38" fill="#fff" font-weight="800">標的血管上の偶発動脈瘤</text><text x="64" y="98" font-size="24" fill="#ccebed">脳梗塞MT時の安全性と有効性</text><text x="1390" y="72" font-size="24" fill="#fff">PMID: 40306926</text><rect x="64" y="168" width="450" height="410" rx="14" fill="#e6f4f1" stroke="#64aaa5" stroke-width="4"/><rect x="575" y="168" width="450" height="410" rx="14" fill="#fff7ea" stroke="#e3a548" stroke-width="4"/><rect x="1086" y="168" width="450" height="410" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="96" y="218" font-size="30" fill="#12615b" font-weight="800">対象</text><text x="96" y="282" font-size="26" fill="#20303a" font-weight="700">標的血管に未破裂動脈瘤</text><text x="96" y="318" font-size="26" fill="#20303a">104例</text><text x="96" y="354" font-size="26" fill="#20303a">対照416例</text><text x="607" y="218" font-size="30" fill="#8b5a04" font-weight="800">治療</text><text x="607" y="282" font-size="26" fill="#20303a" font-weight="700">MT施行</text><text x="607" y="318" font-size="26" fill="#20303a">年齢・性別マッチ対照</text><text x="1118" y="218" font-size="30" fill="#9a312c" font-weight="800">主要結果</text><text x="1118" y="282" font-size="26" fill="#20303a" font-weight="700">良好転帰は同等</text><text x="1118" y="318" font-size="26" fill="#20303a">再開通率も同等</text><text x="1118" y="354" font-size="26" fill="#20303a">破裂 5.8%</text><rect x="64" y="638" width="1472" height="150" rx="18" fill="#fff" stroke="#d6e2e2" stroke-width="3"/><text x="96" y="692" font-size="30" fill="#153f4a" font-weight="800">臨床的Take-home</text><text x="96" y="742" font-size="30" fill="#20303a" font-weight="700">MTは可能だが、動脈瘤サイズ・部位を踏まえた手技計画が重要。</text></svg>