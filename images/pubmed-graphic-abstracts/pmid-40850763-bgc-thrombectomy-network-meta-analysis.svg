  <text x="60" y="57" font-size="39" fill="#ffffff" font-weight="850">前方循環LVOの初回MT戦略</text>
  <text x="60" y="98" font-size="24" fill="#cfecee" font-weight="650">BGC併用の有効性をネットワークメタ解析で比較</text>
  <text x="1376" y="72" font-size="23" fill="#ffffff" font-weight="750">PMID: 40850763</text>
  <rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/>
  <text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text>
  <text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">44研究 19,268例</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">前方循環LVO</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">初回血栓回収法を比較</text>
  <rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/>
  <text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">方法・比較</text>
  <text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">CA・SR・SRA</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">BGC併用の有無</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">ベイズ流NMA</text>
  <rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/>
  <text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text>
  <text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">SRA+BGC: 再開通/FPEで最良</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">CA+BGC: 90日自立と低死亡で最良</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">BGC併用が全体に優位</text>
