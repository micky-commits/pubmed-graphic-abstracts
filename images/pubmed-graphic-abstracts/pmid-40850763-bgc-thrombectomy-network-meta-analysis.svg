  <text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">BGC併用が</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">成績を底上げ</text>
  <text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">CA+BGCは</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">機能転帰に強い</text>
  <text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">SRA+BGCは</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">再開通に強い</text>
  <rect x="60" y="722" width="1480" height="94" rx="18" fill="#143f4a"/>
  <text x="92" y="780" font-size="30" fill="#ffffff" font-weight="850">初回MTではBGCを組み込む戦略が、再開通・機能転帰・安全性のバランスで有望。</text>
  <text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 40850763</text>
