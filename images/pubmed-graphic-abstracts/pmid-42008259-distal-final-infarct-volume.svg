<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">DISTAL Imaging Analysis: MeVO/遠位閉塞で救済された脳組織</text><text x="60" y="98" class="sub" fill="#c9eceb">EVT+BMT vs BMT単独を、最終梗塞体積とVrelで評価</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 42008259</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">対象</text><text x="84" y="242" class="t">DISTAL trial 事後画像解析</text><text x="84" y="276" class="t">灌流画像 + 24時間画像あり</text><text x="84" y="310" class="t">447例 / 55施設・11か国</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">評価の考え方</text><path d="M550 296 L780 296" stroke="#2b6f9e" stroke-width="18" stroke-linecap="round"/><path d="M780 296 L1030 296" stroke="#c7514a" stroke-width="18" stroke-linecap="round"/><text x="552" y="260" class="s blue">Tmax&gt;6秒: リスク組織</text><text x="790" y="260" class="s coral">24h 最終梗塞</text><text x="560" y="348" class="t ink">Vrel = 救済されたリスク組織割合</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">比較</text><text x="1180" y="242" class="t">EVT + best medical treatment</text><text x="1180" y="276" class="t">vs</text><text x="1180" y="310" class="t">best medical treatment単独</text><text x="1180" y="344" class="t">90日転帰との関連も評価</text><line x1="240" y1="442" x2="1360" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="604" y="432" class="s muted">画像上の救済量と臨床転帰を接続する解析</text><rect x="80" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="108" y="528" class="h teal">EVT+BMT</text><text x="108" y="576" class="num teal">Vrel 0.8</text><text x="108" y="606" class="xs muted">中央値 0.8 / BMTは0.6</text><rect x="446" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="474" y="528" class="h blue">良好画像転帰</text><text x="474" y="576" class="num blue">aOR 1.6</text><text x="474" y="606" class="xs muted">Vrel ≥0.8 達成</text><rect x="812" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="840" y="528" class="h amber">成功再灌流</text><text x="840" y="576" class="num amber">aOR 2.5</text><text x="840" y="606" class="xs muted">良好画像転帰と関連</text><rect x="1178" y="484" width="342" height="142" rx="18" class="card"/><text x="1206" y="528" class="h deep">90日転帰</text><text x="1206" y="576" class="num deep">関連あり</text><text x="1206" y="606" class="xs muted">保存脳組織が多いほど良好</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">小さめの最終梗塞だけでなく、初期リスク組織のどれだけを救えたかが重要。</text><text x="96" y="786" class="t">MeVO/遠位閉塞のEVT評価に画像バイオマーカーを加える視点。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">DISTAL本体試験の事後解析。臨床試験の主要結論とは分けて解釈。</text><text x="862" y="786" class="t">画像がそろった患者に限定される。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: MeVO/遠位閉塞でも、EVTの価値を「救済脳組織量」で可視化できる。</text></svg>