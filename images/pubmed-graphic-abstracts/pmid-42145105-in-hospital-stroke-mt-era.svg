<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fbff"/>
  <rect x="36" y="30" width="1528" height="128" rx="18" fill="#0b5f7a"/>
  <text x="72" y="82" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="36" font-weight="700" fill="#fff">院内発症脳卒中: MT時代でも残る格差</text>
  <text x="72" y="125" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="23" fill="#d7f3ff">PMID: 42145105 | Stroke 2026 | GWTG-Stroke 2016-2023</text>
  <rect x="60" y="190" width="470" height="305" rx="16" fill="#fff" stroke="#86c5da" stroke-width="3"/>
  <text x="92" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0b5f7a">対象</text>
  <text x="92" y="300" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">GWTG-Stroke</text>
  <text x="92" y="350" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">2016-2023</text>
  <text x="92" y="400" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">虚血性脳卒中 約500万例</text>
  <text x="92" y="450" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#0f172a">院内発症 3.8%</text>
  <rect x="565" y="190" width="470" height="305" rx="16" fill="#fff7ed" stroke="#f1a768" stroke-width="3"/>
  <text x="597" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#9a3412">重症度と転帰</text>
  <text x="597" y="315" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" fill="#7c2d12">NIHSS&gt;20: 14.5% vs 7.9%</text>
  <text x="597" y="375" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" fill="#7c2d12">死亡 aOR 2.27</text>
  <text x="597" y="435" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#7c2d12">市中発症より不良</text>
  <rect x="1070" y="190" width="470" height="305" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="1102" y="242" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="32" font-weight="700" fill="#0e7490">改善点</text>
  <text x="1102" y="315" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="30" fill="#155e75">MT率は経年的に増加</text>
  <text x="1102" y="375" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="30" fill="#155e75">品質指標は改善</text>
  <text x="1102" y="435" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="28" fill="#155e75">それでも転帰格差は残存</text>
  <rect x="60" y="525" width="1480" height="176" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="575" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="34" font-weight="700" fill="#0f172a">Take-home</text>
  <text x="92" y="625" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">院内発症脳卒中はMT時代でも重症・死亡高リスク。</text>
  <text x="92" y="667" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="29" fill="#0f172a">院内認識・コード発動・治療導線の改善が、次の品質改善ターゲット。</text>
  <text x="60" y="875" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="20" fill="#64748b">Nouh A, et al. Stroke. 2026. PMID: 42145105</text>
</svg>
