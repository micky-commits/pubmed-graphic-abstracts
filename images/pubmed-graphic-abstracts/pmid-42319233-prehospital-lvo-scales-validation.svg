<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="122" fill="#143f4a"/><text x="60" y="57" font-size="39" fill="#fff" font-weight="850">病院前LVOスケールの限界</text><text x="60" y="98" font-size="24" fill="#cfecee" font-weight="650">46スケール55閾値を実臨床コホートで検証</text><text x="1376" y="72" font-size="23" fill="#fff" font-weight="750">PMID: 42319233</text><rect x="60" y="154" width="442" height="338" rx="14" fill="#e7f5f2" stroke="#65aaa4" stroke-width="4"/><text x="92" y="207" font-size="31" fill="#11635d" font-weight="850">対象</text><text x="92" y="268" font-size="27" fill="#1d2f36" font-weight="650">疑い脳卒中 1,150例</text><text x="92" y="305" font-size="27" fill="#1d2f36" font-weight="650">LVO有病率 13.5%</text><text x="92" y="342" font-size="27" fill="#1d2f36" font-weight="650">一次脳卒中センター</text><rect x="579" y="154" width="442" height="338" rx="14" fill="#fff7eb" stroke="#e2a249" stroke-width="4"/><text x="611" y="207" font-size="31" fill="#8a5905" font-weight="850">方法・比較</text><text x="611" y="268" font-size="27" fill="#1d2f36" font-weight="650">CTA確定LVOを基準</text><text x="611" y="305" font-size="27" fill="#1d2f36" font-weight="650">AUC・感度・特異度</text><text x="611" y="342" font-size="27" fill="#1d2f36" font-weight="650">患者背景別に評価</text><rect x="1098" y="154" width="442" height="338" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="1130" y="207" font-size="31" fill="#9a312c" font-weight="850">結果</text><text x="1130" y="268" font-size="27" fill="#1d2f36" font-weight="650">AUC 0.586-0.855</text><text x="1130" y="305" font-size="27" fill="#1d2f36" font-weight="650">最良FAST-ED</text><text x="1130" y="342" font-size="27" fill="#1d2f36" font-weight="650">感度/特異度とも80%超なし</text><path d="M520 335h45m-10-20l25 20-25 20M1039 335h45m-10-20l25 20-25 20" fill="none" stroke="#53656d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><rect x="566" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><rect x="1072" y="536" width="468" height="138" rx="14" fill="#fff" stroke="#d8e5e5" stroke-width="3"/><text x="92" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 1</text><text x="92" y="636" font-size="25" fill="#1d2f36" font-weight="720">臨床スケール単独では</text><text x="92" y="671" font-size="25" fill="#1d2f36" font-weight="720">LVO検出に限界</text><text x="598" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 2</text><text x="598" y="636" font-size="25" fill="#1d2f36" font-weight="720">左半球・高齢で</text><text x="598" y="671" font-size="25" fill="#1d2f36" font-weight="720">精度が高め</text><text x="1104" y="592" font-size="25" fill="#143f4a" font-weight="800">Point 3</text><text x="1104" y="636" font-size="25" fill="#1d2f36" font-weight="720">搬送判断は</text><text x="1104" y="671" font-size="25" fill="#1d2f36" font-weight="720">画像/遠隔支援も検討</text><rect x="60" y="722" width="1480" height="94" rx="18" fill="#143f4a"/><text x="92" y="780" font-size="30" fill="#fff" font-weight="850">LVOトリアージをスケール単独に依存せず、地域導線と追加評価を組み合わせる。</text><text x="60" y="858" font-size="19" fill="#61747b">Japanese graphical abstract / PubMed新着文献アラート / 42319233</text></svg>
