<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="1600" height="900" fill="#f7fbfb"/><rect width="1600" height="118" fill="#153f4a"/><text x="64" y="58" font-size="38" fill="#fff" font-weight="800">MT後sICHと減圧開頭</text><text x="64" y="98" font-size="24" fill="#ccebed">STAR registryから見た機能転帰への影響</text><text x="1390" y="72" font-size="24" fill="#fff">PMID: 40488514</text><rect x="64" y="168" width="450" height="410" rx="14" fill="#e6f4f1" stroke="#64aaa5" stroke-width="4"/><rect x="575" y="168" width="450" height="410" rx="14" fill="#fff7ea" stroke="#e3a548" stroke-width="4"/><rect x="1086" y="168" width="450" height="410" rx="14" fill="#fdeeed" stroke="#df7e74" stroke-width="4"/><text x="96" y="218" font-size="30" fill="#12615b" font-weight="800">対象</text><text x="96" y="282" font-size="26" fill="#20303a" font-weight="700">MT後の症候性脳内出血</text><text x="96" y="318" font-size="26" fill="#20303a">464例</text><text x="96" y="354" font-size="26" fill="#20303a">DC施行 20.9%</text><text x="607" y="218" font-size="30" fill="#8b5a04" font-weight="800">比較</text><text x="607" y="282" font-size="26" fill="#20303a" font-weight="700">減圧開頭あり</text><text x="607" y="318" font-size="26" fill="#20303a">vs なし</text><text x="1118" y="218" font-size="30" fill="#9a312c" font-weight="800">主要結果</text><text x="1118" y="282" font-size="26" fill="#20303a" font-weight="700">機能転帰改善は示せず</text><text x="1118" y="318" font-size="26" fill="#20303a">死亡率低下の可能性</text><text x="1118" y="354" font-size="26" fill="#20303a">選択バイアスに注意</text><rect x="64" y="638" width="1472" height="150" rx="18" fill="#fff" stroke="#d6e2e2" stroke-width="3"/><text x="96" y="692" font-size="30" fill="#153f4a" font-weight="800">臨床的Take-home</text><text x="96" y="742" font-size="30" fill="#20303a" font-weight="700">救命的介入としての意味と、良好機能転帰の限界を分けて考える。</text></svg>