<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">MT後sICHに対する減圧開頭: Helping or Hurting?</text><text x="60" y="98" class="sub" fill="#c9eceb">STAR registryで機能転帰と死亡を検討</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 40488514</text><rect x="54" y="154" width="396" height="246" rx="18" class="coralCard"/><text x="84" y="198" class="h coral">臨床状況</text><text x="84" y="242" class="t">前方循環LVOにMT</text><text x="84" y="276" class="t">その後 sICHを発症</text><text x="84" y="310" class="t">STAR database 464例</text><text x="84" y="344" class="t">DC施行 97例 (20.9%)</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">解析</text><text x="518" y="242" class="t">主要評価: 90日 mRS 0-3</text><text x="518" y="276" class="t">多変量ロジスティック回帰</text><text x="518" y="310" class="t">propensity-score matching</text><text x="518" y="344" class="t">重症例選択の影響を調整</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">DC群の特徴</text><text x="1180" y="242" class="t">若年・女性が多い</text><text x="1180" y="276" class="t">出血グレード高い</text><text x="1180" y="310" class="t">重症例が選ばれやすい</text><text x="1180" y="344" class="t">適応選択バイアスに注意</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="584" y="432" class="s muted">「死亡」と「機能自立」を分けて読む必要がある</text><rect x="80" y="484" width="342" height="142" rx="18" class="coralCard"/><text x="108" y="528" class="h coral">全体転帰</text><text x="108" y="576" class="num coral">14%</text><text x="108" y="606" class="xs muted">90日 mRS 0-3</text><rect x="446" y="484" width="342" height="142" rx="18" class="grayCard"/><text x="474" y="528" class="h deep">死亡率</text><text x="474" y="576" class="num deep">56%</text><text x="474" y="606" class="xs muted">90日死亡</text><rect x="812" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="840" y="528" class="h amber">DC vs no DC</text><text x="840" y="576" class="num amber">差なし</text><text x="840" y="606" class="xs muted">粗解析で主要転帰改善なし</text><rect x="1178" y="484" width="342" height="142" rx="18" class="coralCard"/><text x="1206" y="528" class="h coral">PS matching</text><text x="1206" y="576" class="num coral">8% vs 24%</text><text x="1206" y="606" class="xs muted">DC群で良好転帰低率</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">DCは重症例に選ばれやすく、単純比較で効果を断定しにくい。</text><text x="96" y="786" class="t">家族説明では救命可能性と重度障害リスクを分けて共有する。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">観察研究で、治療選択はランダム化されていない。</text><text x="862" y="786" class="t">DCのタイミング・出血型・梗塞範囲で個別判断が必要。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: 減圧開頭は救命的意味を持ち得るが、良好機能転帰の改善とは別問題。</text></svg>