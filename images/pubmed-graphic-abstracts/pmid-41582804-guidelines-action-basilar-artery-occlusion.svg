<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.bg{fill:#f7fbfb}.ink{fill:#17323a}.muted{fill:#61757b}.deep{fill:#123f49}.teal{fill:#0f766e}.blue{fill:#2b6f9e}.coral{fill:#c7514a}.amber{fill:#9a6500}.violet{fill:#6b5aa8}.title{font:800 40px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.sub{font:700 23px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.h{font:800 27px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.t{font:650 22px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.s{font:600 18px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.xs{font:600 15px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.num{font:850 42px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.card{fill:#fff;stroke:#d5e3e3;stroke-width:2}.tealCard{fill:#e7f4f1;stroke:#5daaa4;stroke-width:3}.blueCard{fill:#eaf3f9;stroke:#74a8c9;stroke-width:3}.amberCard{fill:#fff5df;stroke:#dea34a;stroke-width:3}.coralCard{fill:#fdebea;stroke:#db7771;stroke-width:3}.violetCard{fill:#f0eef9;stroke:#9a8ec8;stroke-width:3}.grayCard{fill:#f2f5f5;stroke:#ccd8d8;stroke-width:2}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#49636b"/></marker></defs><rect class="bg" width="1600" height="900"/><rect x="0" y="0" width="1600" height="126" fill="#123f49"/><text x="58" y="58" class="title" fill="#fff">BAO Guidelines in Action: 脳底動脈閉塞と血栓回収</text><text x="60" y="98" class="sub" fill="#c9eceb">後方循環では、時間・重症度・画像・導線を同時に判断する</text><rect x="1284" y="35" width="258" height="54" rx="12" fill="#e7f4f1"/><text x="1310" y="69" class="sub deep">PMID 41582804</text><rect x="54" y="154" width="396" height="246" rx="18" class="tealCard"/><text x="84" y="198" class="h teal">臨床シナリオ</text><text x="84" y="242" class="t">脳底動脈閉塞 (BAO)</text><text x="84" y="276" class="t">意識障害・脳幹症状</text><text x="84" y="310" class="t">後方循環特有の重症化</text><text x="84" y="344" class="t">迅速な再開通判断</text><rect x="486" y="154" width="628" height="246" rx="18" class="card"/><text x="518" y="198" class="h deep">判断の4軸</text><rect x="540" y="238" width="250" height="56" rx="14" class="blueCard"/><text x="566" y="274" class="t blue">1. 発症/最終健常時間</text><rect x="820" y="238" width="250" height="56" rx="14" class="tealCard"/><text x="846" y="274" class="t teal">2. NIHSS・意識</text><rect x="540" y="318" width="250" height="56" rx="14" class="amberCard"/><text x="566" y="354" class="t amber">3. 画像コア/虚血範囲</text><rect x="820" y="318" width="250" height="56" rx="14" class="coralCard"/><text x="846" y="354" class="t coral">4. 搬送/治療導線</text><rect x="1150" y="154" width="396" height="246" rx="18" class="amberCard"/><text x="1180" y="198" class="h amber">PubMed情報</text><text x="1180" y="242" class="t">Guidelines in Action形式</text><text x="1180" y="276" class="t">Abstract掲載なし</text><text x="1180" y="310" class="t">Stroke 2026</text><text x="1180" y="344" class="t">実践への落とし込み</text><line x1="220" y1="442" x2="1380" y2="442" stroke="#49636b" stroke-width="4" marker-end="url(#arrow)"/><text x="578" y="432" class="s muted">前方循環LVOとは違い、症候と画像の不一致にも注意する</text><rect x="80" y="484" width="342" height="142" rx="18" class="blueCard"/><text x="108" y="528" class="h blue">時間</text><text x="108" y="576" class="num blue">速く</text><text x="108" y="606" class="xs muted">再開通までの遅れを最小化</text><rect x="446" y="484" width="342" height="142" rx="18" class="tealCard"/><text x="474" y="528" class="h teal">重症度</text><text x="474" y="576" class="num teal">高く</text><text x="474" y="606" class="xs muted">脳幹症状・意識障害を重視</text><rect x="812" y="484" width="342" height="142" rx="18" class="amberCard"/><text x="840" y="528" class="h amber">画像</text><text x="840" y="576" class="num amber">読む</text><text x="840" y="606" class="xs muted">後方循環ASPECTSなど</text><rect x="1178" y="484" width="342" height="142" rx="18" class="coralCard"/><text x="1206" y="528" class="h coral">導線</text><text x="1206" y="576" class="num coral">決める</text><text x="1206" y="606" class="xs muted">直接搬入/転送を迅速判断</text><rect x="64" y="666" width="706" height="134" rx="18" class="card"/><text x="96" y="710" class="h deep">臨床的な読み方</text><text x="96" y="754" class="t">BAOは見逃し・遅れが致命的になりやすい。</text><text x="96" y="786" class="t">症状が重い、画像で救済可能性がある、治療導線が確保できるならMTを急ぐ。</text><rect x="830" y="666" width="706" height="134" rx="18" class="grayCard"/><text x="862" y="710" class="h deep">注意点</text><text x="862" y="754" class="t">Abstractがないため、グラレコはタイトル・書誌情報・一般的ガイドライン実践の要約。</text><text x="862" y="786" class="t">個別症例では施設プロトコルと最新ガイドラインを確認。</text><rect x="64" y="824" width="1472" height="48" rx="14" fill="#123f49"/><text x="92" y="856" class="sub" fill="#fff">Take-home: BAOのMT判断は、時間窓だけでなく重症度と画像、搬送導線を統合する。</text></svg>